<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Inicio · Dental MÁS FÁCIL</title>
  <link rel="icon" type="image/png" href="logo-dental-facil.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:#F0F2F8;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    .card{
      background:#FFFFFF;
      border-radius:24px;
      box-shadow:0 8px 40px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      padding:40px 36px;
      width:100%;
      max-width:420px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:32px;
    }
    .logo-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .logo-wrap img{
      height:48px;
      width:auto;
      display:block;
    }
    .btn-group{
      display:flex;
      flex-direction:column;
      gap:12px;
      width:100%;
    }
    .btn{
      display:block;
      width:100%;
      padding:16px 24px;
      background:#0F172A;
      color:#FFFFFF;
      border:none;
      border-radius:999px;
      font-family:inherit;
      font-size:16px;
      font-weight:600;
      text-align:center;
      text-decoration:none;
      cursor:pointer;
      transition:background .15s ease, transform .1s ease;
      letter-spacing:0.01em;
    }
    .btn:hover{
      background:#1E293B;
    }
    .btn:active{
      transform:scale(0.98);
      opacity:0.9;
    }
    @media (max-width:480px){
      .card{padding:32px 20px; border-radius:20px;}
      .logo-wrap img{height:40px;}
      .btn{font-size:15px; padding:14px 20px;}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="logo-dental-facil.png" alt="Dental MÁS FÁCIL">
    </div>
    <div class="btn-group">
      <a class="btn" href="recepcion.html">Recepción</a>
      <a class="btn" href="citas.html">Citas</a>
    </div>
  </div>
</body>
</html>
