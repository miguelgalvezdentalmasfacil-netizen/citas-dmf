<style>
:root{
  --bg-color:#F8FAFC; --surface:#FFFFFF; --text-main:#0F172A; --text-muted:#64748B; --text-light:#94A3B8;
  --border:#F1F5F9; --border-dark:#E2E8F0; --hover:#F8FAFC;
  --btn-bg:#0F172A; --btn-bg-hover:#1E293B; --btn-text:#FFFFFF;
  --ok:#10B981; --ok-bg:#ECFDF5; --bad:#EF4444; --bad-bg:#FEF2F2; --neutral:#64748B; --neutral-bg:#F1F5F9;
  --radius-lg:24px; --radius-md:12px; --shadow:0 4px 20px rgba(0,0,0,.02);
}
/* dark mode disabled */
/* dark mode disabled */
/* dark mode disabled */
/* dark mode disabled */
/* dark mode disabled */
/* dark mode disabled */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg-color);color:var(--text-main);font-weight:400;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hidden{display:none!important}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:14px 32px;gap:12px}
.logo{display:flex;align-items:center;gap:12px;font-weight:500;letter-spacing:-.3px;font-size:16px}
.logo i{width:36px;height:36px;border-radius:12px;background:var(--btn-bg);color:var(--btn-text);display:grid;place-items:center;font-style:normal;font-weight:600;font-size:14px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:34px;width:auto;display:block}
.brand-lg img{height:36px;width:auto;max-width:100%;object-fit:contain;display:block}
.brand-tag{font-size:13px;font-weight:500;color:var(--text-muted);padding-left:14px;border-left:1px solid var(--border-dark);line-height:20px}
/* dark disabled */
.nav-right{display:flex;align-items:center;gap:10px}
.pill-date{background:var(--bg-color);border:1px solid var(--border-dark);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;color:var(--text-muted);white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border-dark);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text-muted);transition:all .15s ease}
.icon-btn:hover, .icon-btn[aria-expanded="true"]{background:var(--hover);border-color:var(--text-main);color:var(--text-main)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Settings dropdown */
.settings-wrap{position:relative}
.settings-dropdown{position:absolute;right:0;top:calc(100% + 10px);width:260px;background:var(--surface);border:1px solid var(--border-dark);border-radius:18px;box-shadow:0 14px 38px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.04);padding:8px;z-index:100;animation:settingsPop .15s ease-out}
/* dark disabled */
@keyframes settingsPop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.settings-user-header{display:flex;align-items:center;gap:12px;padding:8px 10px 10px}
.settings-avatar{width:38px;height:38px;border-radius:50%;background:var(--btn-bg);color:var(--btn-text);font-weight:600;font-size:15px;display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.settings-user-info{min-width:0;flex:1}
.settings-user-name{font-size:14px;font-weight:600;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.settings-user-role{font-size:11px;font-weight:500;color:var(--text-muted);display:inline-block;background:var(--border);padding:2px 8px;border-radius:10px;margin-top:3px;line-height:1.3}
.settings-divider{height:1px;background:var(--border-dark);margin:6px 2px}
.settings-actions{display:flex;flex-direction:column;gap:2px}
.settings-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;background:transparent;border-radius:10px;font-size:13px;font-weight:500;color:var(--text-main);text-align:left;cursor:pointer;transition:all .15s ease}
.settings-item svg{width:16px;height:16px;color:var(--text-muted);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:color .15s ease}
.settings-item:hover{background:var(--hover);color:var(--text-main)}
.settings-item:hover svg{color:var(--text-main)}
.settings-item-danger{color:#EF4444}
.settings-item-danger svg{color:#EF4444;stroke:#EF4444}
.settings-item-danger:hover{background:var(--bad-bg);color:#DC2626}
.settings-item-danger:hover svg{color:#DC2626;stroke:#DC2626}

/* Layout */
.wrap{max-width:1160px;margin:0 auto;padding:36px 32px 80px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:26px;font-weight:500;letter-spacing:-.5px}
.sub{color:var(--text-muted);font-size:14px;margin-top:2px;text-transform:capitalize}
.sub.nocap{text-transform:none}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border-dark);border-radius:9999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 18px;border-radius:9999px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all .15s ease}
.seg button.on{background:var(--btn-bg);color:var(--btn-text)}
.seg.seg-sm{border-radius:10px;padding:3px;gap:3px;background:var(--bg-color)}
.seg.seg-sm button{padding:6px 12px;font-size:12px;border-radius:8px}
.seg.seg-sm button.on{background:var(--btn-bg);color:var(--btn-text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:600;margin-left:4px;background:var(--border-dark);color:var(--text-muted);vertical-align:middle;line-height:1.2}
.seg button.on .badge{background:rgba(255,255,255,.25);color:#fff}
/* dark disabled */
.badge.alert{background:#FEF3C7;color:#D97706}
/* dark disabled */

/* Buttons */
.btn{border:0;background:var(--btn-bg);color:var(--btn-text);padding:13px 22px;border-radius:var(--radius-md);font-weight:500;cursor:pointer;transition:background .15s ease, border-color .15s ease, opacity .15s ease;white-space:nowrap;-webkit-user-select:none;user-select:none}
@media (hover: hover) and (pointer: fine) {
  .btn:hover{background:var(--btn-bg-hover)}
  .btn.out:hover{transform:translateY(-2px);background:var(--hover);border-color:var(--text-main)}
}
.btn:active{opacity:.75}
.btn.out{background:transparent;border:1px solid var(--border-dark);color:var(--text-main);transition:all .15s ease}
.btn.sm{padding:9px 14px;font-size:13px}
.btn.block{width:100%}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border-dark);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.alert-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border:1px solid var(--border-dark);border-left:4px solid var(--text-main);padding:14px 20px;border-radius:var(--radius-md);margin-bottom:20px;box-shadow:var(--shadow)}
.alert-banner.has-pend{border-left-color:#F59E0B;background:rgba(245,158,11,.04)}
.alert-left{display:flex;align-items:center;gap:14px}
.alert-bell{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--hover);color:var(--text-main);flex-shrink:0}
.alert-banner.has-pend .alert-bell{color:#d97706;background:rgba(217,119,6,.1)}
.alert-banner p{font-size:13px;color:var(--text-muted);margin-top:2px}
.alert-pend{color:#D97706;font-weight:600}
.alert-ok{color:var(--ok);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{padding:24px 28px}
.stat label{display:block;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)}
.stat b{display:block;font-size:30px;font-weight:300;letter-spacing:-1px;margin-top:6px}
.stat b.ok{color:var(--ok)} .stat b.bad{color:var(--bad)} .stat b.warn{color:#d97706}

/* Period Navigation Bar (Semana / Mes) */
.period-nav-container{margin-bottom:18px;position:relative;z-index:25}
.period-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 18px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border-dark);box-shadow:var(--shadow)}
.period-bar-left{display:flex;align-items:center;flex-shrink:0}
.p-btn-group{display:inline-flex;gap:3px;background:var(--bg-color);padding:3px;border-radius:var(--radius-md);border:1px solid var(--border-dark)}
.p-nav-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:12.5px;font-weight:500;border:0!important;background:transparent!important;color:var(--text-muted)!important;border-radius:calc(var(--radius-md) - 2px)!important;cursor:pointer;transition:all .15s ease;white-space:nowrap}
.p-nav-btn:hover{background:var(--hover)!important;color:var(--text-main)!important;transform:none!important}
.p-nav-btn.active{background:var(--btn-bg)!important;color:var(--btn-text)!important;font-weight:600}
.period-bar-center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;flex:1 1 auto;min-width:0}
.period-title-row{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.p-cal-icon{color:var(--text-muted);flex-shrink:0}
.period-month-name{font-weight:600;color:var(--text-main);font-size:15px;white-space:nowrap}
.period-range-sub{font-size:12px;color:var(--text-muted);font-weight:400;white-space:nowrap}
.pill-curr{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--ok-bg);color:var(--ok);margin-left:4px;white-space:nowrap;flex-shrink:0}
.p-mode-segmented{display:inline-flex;align-items:center;background:var(--bg-color);border:1px solid var(--border-dark);border-radius:999px;padding:2px;gap:2px;margin-top:2px}
.p-seg-pill{border:0;background:transparent;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all .15s ease;white-space:nowrap}
.p-seg-pill.on{background:var(--btn-bg);color:var(--btn-text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.period-bar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.p-picker-label{font-size:12px;font-weight:500;color:var(--text-muted);white-space:nowrap}
.p-picker-input{height:34px;padding:0 10px;font-size:12.5px;color:var(--text-main);background:var(--bg-color);border:1px solid var(--border-dark);border-radius:var(--radius-md);outline:none;transition:border-color .15s ease;cursor:pointer}
.p-picker-input:focus{border-color:var(--text-main)}
.p-picker-sel{min-width:200px;max-width:250px}

/* Sync indicator */
.pill-sync{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border-radius:50%;background:var(--hover);border:1px solid var(--border-dark);margin-right:4px;cursor:default;flex-shrink:0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#10b981;transition:background .2s}
.sync-dot.busy{background:#f59e0b;animation:pulseDot 1s infinite}
.sync-dot.offline{background:#ef4444}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.3}}

/* Filters Card */
.filters-card{background:var(--surface);border:1px solid var(--border-dark);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;position:relative;z-index:15}
.filters-card:not(.hidden){animation:filterCardSlide .2s cubic-bezier(0.16,1,0.3,1)}
@keyframes filterCardSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.btn-filter-toggle{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border-dark);color:var(--text-muted);padding:8px 14px;border-radius:var(--radius-md);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s ease;white-space:nowrap}
.btn-filter-toggle:hover{background:var(--hover);border-color:var(--text-main);color:var(--text-main)}
.btn-filter-toggle.active{background:rgba(0,151,167,.1);border-color:#0097a7;color:#0097a7;font-weight:600}
.btn-filter-toggle.has-filters{border-color:#0097a7;color:#0097a7}
.filter-badge-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:11px;font-weight:700;background:#0097a7;color:#fff;line-height:1}
.filters-top{display:flex;align-items:center;gap:10px;width:100%}
.search-wrap{flex:1 1 240px;min-width:180px;position:relative;display:flex;align-items:center}
.f-icon{position:absolute;left:11px;color:var(--text-muted);pointer-events:none}
.f-inp{width:100%;height:38px;background:var(--bg-color);border:1px solid var(--border-dark);border-radius:var(--radius-md);padding:0 30px 0 34px;font-size:13px;color:var(--text-main);outline:none;transition:all .15s ease;box-sizing:border-box}
.f-inp:focus{border-color:var(--text-main);box-shadow:0 0 0 2px rgba(0,151,167,.12)}
.f-inp::placeholder{color:var(--text-light)}
.f-clear-btn{position:absolute;right:8px;background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;padding:4px 6px;border-radius:50%;transition:all .15s ease}
.f-clear-btn:hover{color:var(--text-main);background:var(--hover)}
.filters-top-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.date-filter-group{display:inline-flex;align-items:center;flex-wrap:nowrap!important;flex-shrink:0;border:1px solid var(--border-dark);border-radius:var(--radius-md);background:var(--bg-color);height:38px;box-sizing:border-box;transition:all .15s ease}
.date-filter-group:focus-within{border-color:#0097a7;box-shadow:0 0 0 2px rgba(0,151,167,.12)}
.date-filter-group.has-val{border-color:#0097a7;background:rgba(0,151,167,.04)}
.date-filter-group .date-wrap{position:relative;display:flex;align-items:center;flex:0 0 auto}
.date-filter-group .date-wrap .cdp-wrap{width:auto}
.date-filter-group .cdp-trigger{border:none!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;height:36px;min-width:160px;padding:0 10px 0 12px;font-size:12.5px;box-sizing:border-box}
.date-filter-group .c-select-wrap{flex:0 0 auto;width:auto!important;min-width:145px;border-left:1px solid var(--border-dark)}
.date-filter-group .c-select-trigger{border:none!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;height:36px;font-size:12px;font-weight:500;color:var(--text-muted);padding:0 10px;box-sizing:border-box}
.date-filter-group .c-select-trigger:hover,.date-filter-group .cdp-trigger:hover{color:var(--text-main);background:var(--hover)!important}
.filters-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.f-reset-btn{height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-size:12.5px;font-weight:500;color:#0097a7;border:1px solid rgba(0,151,167,.3);background:rgba(0,151,167,.06);cursor:pointer;border-radius:var(--radius-md);transition:all .15s ease;white-space:nowrap}
.f-reset-btn:hover{background:rgba(0,151,167,.14);border-color:#0097a7;color:#00838f}
.f-close-btn{height:38px;display:inline-flex;align-items:center;gap:5px;padding:0 12px;font-size:12px;font-weight:500;color:var(--text-muted);background:transparent;border:1px solid var(--border-dark);border-radius:var(--radius-md);cursor:pointer;transition:all .15s ease;white-space:nowrap}
.f-close-btn:hover{background:var(--hover);color:var(--text-main);border-color:var(--text-main)}
.f-sel{height:38px;width:100%;background-color:var(--bg-color);border:1px solid var(--border-dark);border-radius:var(--radius-md);padding:0 28px 0 11px;font-size:13px;color:var(--text-main);outline:none;transition:all .15s ease;cursor:pointer}
.f-sel-criteria{height:38px;min-width:145px}
.f-date-inp{height:38px;padding:0 10px 0 32px;min-width:150px;cursor:pointer}
.f-sel.has-val,.f-date-inp.has-val,.f-inp.has-val{border-color:#0097a7;background-color:rgba(0,151,167,.04)}
.filters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;align-items:flex-end;padding-top:12px;border-top:1px solid var(--border)}
.f-item{display:flex;flex-direction:column;gap:5px;min-width:0}
.f-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)}

/* ============ CUSTOM SELECT & DROPDOWNS ============ */
.c-select-wrap{position:relative;display:inline-block;width:100%}
.filters-top .c-select-wrap{width:auto;flex:1 1 180px}
.period-bar-right .c-select-wrap{width:auto;min-width:200px;max-width:260px}
.c-select-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:38px;padding:0 12px;background-color:var(--bg-color);border:1px solid var(--border-dark);border-radius:var(--radius-md);color:var(--text-main);font-size:13px;cursor:pointer;outline:none;transition:all .15s ease;user-select:none;text-align:left;box-sizing:border-box}
.period-bar-right .c-select-trigger{height:34px;padding:0 10px;font-size:12.5px}
.inp.c-select-trigger{height:48px;padding:0 16px;font-size:14px}
.inp.sm.c-select-trigger{height:36px;padding:0 12px;font-size:12.5px}
.c-select-trigger:hover{border-color:var(--text-muted)}
.c-select-trigger:focus-visible,.c-select-trigger.open{border-color:var(--text-main);box-shadow:0 0 0 2px rgba(0,151,167,.15)}
.c-select-trigger.has-val{border-color:#0097a7;background-color:rgba(0,151,167,.04)}
.c-select-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;line-height:1.2}
.c-select-arrow{display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0;transition:transform .2s ease}
.c-select-trigger.open .c-select-arrow{transform:rotate(180deg);color:var(--text-main)}
.c-select-menu{position:absolute;top:calc(100% + 5px);left:0;min-width:100%;max-width:320px;max-height:260px;overflow-y:auto;background:var(--surface);border:1px solid var(--border-dark);border-radius:10px;box-shadow:0 12px 28px -4px rgba(0,0,0,.15),0 4px 12px rgba(0,0,0,.06);z-index:1000;padding:5px;list-style:none;display:flex;flex-direction:column;gap:2px;animation:cDropFade .12s ease-out}
@keyframes cDropFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
/* dark disabled */
.period-bar-right .c-select-menu{right:0;left:auto;min-width:100%;width:max-content;max-width:280px}
.c-select-menu::-webkit-scrollbar{width:6px}
.c-select-menu::-webkit-scrollbar-thumb{background:var(--border-dark);border-radius:999px}
.c-select-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;font-size:12.5px;color:var(--text-main);border-radius:6px;cursor:pointer;transition:background .12s ease,color .12s ease;user-select:none;line-height:1.35}
.c-select-opt:hover{background:var(--hover);color:var(--text-main)}
.c-select-opt.selected{background:rgba(0,151,167,.08);color:#0097a7;font-weight:600}
/* dark disabled */
.c-select-opt-text{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-select-check{flex-shrink:0;color:#0097a7}
/* dark disabled */

/* ============ CUSTOM MONTH PICKER ============ */
.cmp-wrap{position:relative;display:inline-block}
.period-bar-right .cmp-wrap{min-width:180px;max-width:240px}
.cmp-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;padding:0 12px;background-color:var(--bg-color);border:1px solid var(--border-dark);border-radius:var(--radius-md);color:var(--text-main);font-size:12.5px;font-weight:500;cursor:pointer;outline:none;transition:all .15s ease;white-space:nowrap;user-select:none;box-sizing:border-box}
.inp.sm.cmp-trigger{height:36px;font-size:12.5px}
.cmp-trigger:hover{border-color:var(--text-muted)}
.cmp-trigger:focus-visible,.cmp-trigger.open{border-color:var(--text-main);box-shadow:0 0 0 2px rgba(0,151,167,.15)}
.cmp-trigger-cal{color:var(--text-muted);flex-shrink:0}
.cmp-chevron{color:var(--text-muted);flex-shrink:0;transition:transform .2s ease}
.cmp-trigger.open .cmp-chevron{transform:rotate(180deg);color:var(--text-main)}
.cmp-popover{position:absolute;top:calc(100% + 6px);right:0;width:240px;background:var(--surface);border:1px solid var(--border-dark);border-radius:12px;box-shadow:0 12px 30px -4px rgba(0,0,0,.15),0 4px 12px rgba(0,0,0,.06);z-index:1000;padding:12px;animation:cDropFade .12s ease-out;user-select:none}
/* dark disabled */
.cmp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.cmp-year-title{font-size:14px;font-weight:600;color:var(--text-main);letter-spacing:-.2px}
.cmp-nav-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--border-dark);background:var(--bg-color);color:var(--text-muted);cursor:pointer;transition:all .15s ease}
.cmp-nav-btn:hover{background:var(--hover);color:var(--text-main);border-color:var(--text-muted)}
.cmp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.cmp-m-btn{padding:8px 4px;border:1px solid transparent;background:transparent;border-radius:8px;font-size:12px;font-weight:500;color:var(--text-main);text-align:center;cursor:pointer;transition:all .15s ease}
.cmp-m-btn:hover{background:var(--hover)}
.cmp-m-btn.is-curr{border-color:rgba(0,151,167,.4);color:#0097a7}
.cmp-m-btn.selected{background:var(--btn-bg);color:var(--btn-text);font-weight:600;border-color:var(--btn-bg)}
.cmp-foot{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:center}
.cmp-today-btn{background:transparent;border:none;font-size:11.5px;font-weight:500;color:#0097a7;cursor:pointer;padding:4px 8px;border-radius:4px;transition:all .15s ease}
.cmp-today-btn:hover{background:rgba(0,151,167,.08)}

/* ============ CUSTOM DATE PICKER ============ */
.cdp-wrap{position:relative;display:inline-block;width:100%}
.date-wrap .cdp-wrap{width:100%}
.date-wrap:has(.cdp-wrap) > .f-icon, .date-wrap .cdp-wrap ~ .f-icon{display:none!important}
.cdp-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:38px;padding:0 12px;background-color:var(--bg-color);border:1px solid var(--border-dark);border-radius:var(--radius-md);color:var(--text-main);font-size:13px;font-weight:400;cursor:pointer;outline:none;transition:all .15s ease;user-select:none;text-align:left;box-sizing:border-box}
.inp.cdp-trigger{height:48px;padding:0 16px;font-size:14px}
.inp.sm.cdp-trigger{height:36px;padding:0 12px;font-size:12.5px}
.f-inp.cdp-trigger{height:38px;padding:0 12px;font-size:13px;min-width:180px}
.cdp-trigger:hover{border-color:var(--text-muted)}
.cdp-trigger:focus-visible,.cdp-trigger.open{border-color:var(--text-main);box-shadow:0 0 0 2px rgba(0,151,167,.15)}
.cdp-trigger.has-val{border-color:#0097a7;background-color:rgba(0,151,167,.04)}
.cdp-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;line-height:1.2}
.cdp-label.placeholder{color:var(--text-light)}
.cdp-icon{color:var(--text-muted);flex-shrink:0;display:inline-flex;align-items:center}
.cdp-chevron{color:var(--text-muted);flex-shrink:0;transition:transform .2s ease;display:inline-flex;align-items:center}
.cdp-trigger.open .cdp-chevron{transform:rotate(180deg);color:var(--text-main)}

.cdp-popover{position:absolute;top:calc(100% + 6px);left:0;width:280px;background:var(--surface);border:1px solid var(--border-dark);border-radius:14px;box-shadow:0 16px 36px -4px rgba(0,0,0,.18),0 4px 14px rgba(0,0,0,.08);z-index:1000;padding:14px;animation:cDropFade .12s ease-out;user-select:none;box-sizing:border-box}
/* dark disabled */
.cdp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px}
.cdp-title{font-size:13.5px;font-weight:600;color:var(--text-main);letter-spacing:-.2px;text-transform:capitalize}
.cdp-nav{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--border-dark);background:var(--bg-color);color:var(--text-muted);cursor:pointer;transition:all .15s ease}
.cdp-nav:hover{background:var(--hover);color:var(--text-main);border-color:var(--text-muted)}
.cdp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px;text-align:center}
.cdp-wd{font-size:11px;font-weight:600;color:var(--text-muted);padding:4px 0;text-transform:uppercase}
.cdp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cdp-day{aspect-ratio:1;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--text-main);cursor:pointer;transition:all .12s ease}
.cdp-day:hover{background:var(--hover)}
.cdp-day.other-month{color:var(--text-light);opacity:.45}
.cdp-day.is-today{border-color:rgba(0,151,167,.5);color:#0097a7;font-weight:600}
.cdp-day.selected{background:#0097a7!important;color:#fff!important;font-weight:600;border-color:#0097a7!important}
.cdp-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.cdp-btn-action{background:transparent;border:none;font-size:11.5px;font-weight:600;color:#0097a7;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s ease}
.cdp-btn-action:hover{background:rgba(0,151,167,.08)}
.cdp-btn-action.clear{color:var(--text-muted)}
.cdp-btn-action.clear:hover{color:var(--text-main);background:var(--hover)}

/* ============ CUSTOM TIME PICKER ============ */
.ctp-wrap{position:relative;display:inline-block;width:100%}
.ctp-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:38px;padding:0 12px;background-color:var(--bg-color);border:1px solid var(--border-dark);border-radius:var(--radius-md);color:var(--text-main);font-size:13px;font-weight:400;cursor:pointer;outline:none;transition:all .15s ease;user-select:none;text-align:left;box-sizing:border-box}
.inp.ctp-trigger{height:48px;padding:0 16px;font-size:14px}
.inp.sm.ctp-trigger{height:36px;padding:0 12px;font-size:12.5px}
.ctp-trigger:hover{border-color:var(--text-muted)}
.ctp-trigger:focus-visible,.ctp-trigger.open{border-color:var(--text-main);box-shadow:0 0 0 2px rgba(0,151,167,.15)}
.ctp-trigger.has-val{border-color:#0097a7;background-color:rgba(0,151,167,.04)}
.ctp-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;line-height:1.2}
.ctp-label.placeholder{color:var(--text-light)}
.ctp-icon{color:var(--text-muted);flex-shrink:0;display:inline-flex;align-items:center}
.ctp-chevron{color:var(--text-muted);flex-shrink:0;transition:transform .2s ease;display:inline-flex;align-items:center}

.ctp-popover{position:absolute;top:calc(100% + 6px);left:0;width:260px;background:var(--surface);border:1px solid var(--border-dark);border-radius:14px;box-shadow:0 16px 36px -4px rgba(0,0,0,.18),0 4px 14px rgba(0,0,0,.08);z-index:1000;padding:14px;animation:cDropFade .12s ease-out;user-select:none;box-sizing:border-box}

.ctp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.ctp-display{font-size:18px;font-weight:700;letter-spacing:-.5px;color:var(--text-main);font-variant-numeric:tabular-nums}
.ctp-ampm-seg{display:inline-flex;background:var(--bg-color);border:1px solid var(--border-dark);border-radius:8px;padding:2px;gap:2px}
.ctp-ampm-btn{border:none;background:transparent;padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .15s ease}

.ctp-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctp-col-title{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:6px;text-align:center}
.ctp-col-list{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding-right:2px}
.ctp-col-list::-webkit-scrollbar{width:4px}
.ctp-col-list::-webkit-scrollbar-thumb{background:var(--border-dark);border-radius:999px}
.ctp-val-btn{padding:6px 0;text-align:center;border-radius:6px;border:1px solid transparent;background:transparent;font-size:13px;font-weight:500;color:var(--text-main);cursor:pointer;transition:all .12s ease}
.ctp-val-btn:hover{background:var(--hover)}
.ctp-val-btn.selected{background:rgba(0,151,167,.12);color:#0097a7;font-weight:600;border-color:rgba(0,151,167,.3)}
/* dark disabled */

.ctp-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.ctp-preset-btn{padding:4px 0;text-align:center;border-radius:6px;border:1px solid var(--border-dark);background:var(--bg-color);font-size:11px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all .12s ease}
.ctp-preset-btn:hover{background:var(--hover);color:var(--text-main);border-color:var(--text-main)}

.ctp-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}

/* Forms */
label.l{display:block;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px}
.inp{width:100%;background:var(--bg-color);border:1px solid var(--border-dark);padding:14px 16px;border-radius:var(--radius-md);outline:none;transition:border-color .15s ease}
.inp:focus{border-color:var(--text-main)}
.inp::placeholder{color:var(--text-light)}
textarea.inp{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin-bottom:18px}

/* List */
.day{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin:28px 4px 12px}
.list{overflow:hidden}
.row{display:grid;grid-template-columns:95px minmax(180px, 1.2fr) minmax(240px, 1.6fr) 120px auto;gap:20px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--border);transition:background .15s ease}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row .time{display:flex;flex-direction:column;gap:3px;min-width:0}
.row-hora{font-size:19px;font-weight:600;letter-spacing:-.5px;color:var(--text-main);line-height:1.1}
.row-cita-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#0097a7;background:rgba(0,151,167,.12);padding:2px 7px;border-radius:4px;width:fit-content;margin-top:2px;white-space:nowrap}
.row .who,.row .what{min-width:0}
.row .who > b, .row .what > b, .row .what-title{font-weight:600;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-main);line-height:1.3}
.row b{font-weight:600;color:var(--text-main)}
.row span.m{display:block;font-size:13px;color:var(--text-muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.row .who span.m{white-space:normal}
.row span b, .row div b, .row-budget-pill b, .reg-meta b, .reg-badge b, .row-cita-badge b, .what-meta b{display:inline!important;font-weight:600;color:inherit}
.what-meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-top:4px;flex-wrap:wrap;line-height:1.4}
.what-sep{opacity:.4;margin:0 1px}
.what-type{font-weight:500;color:var(--text-main);white-space:nowrap}
.what-advisor{color:var(--text-muted);white-space:nowrap}
.what-advisor b{color:var(--text-main)!important;display:inline!important;font-weight:600}
.what-branch{white-space:nowrap}
.reg-meta,.reg-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px!important;color:var(--text-muted)!important;margin-top:4px;background:var(--hover);padding:3px 8px;border-radius:4px;width:fit-content;max-width:100%;border:1px solid var(--border-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.reg-meta svg,.reg-badge svg{flex-shrink:0;color:var(--text-muted);opacity:.75}
.reg-meta b,.reg-badge b{font-weight:600;color:var(--text-main);display:inline}
.reg-sep{opacity:.4;margin:0 1px}
.wa-link{color:#059669!important;font-weight:500!important;text-decoration:none}
.wa-link:hover{text-decoration:underline}
.act{display:flex;gap:8px;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:9999px;font-size:12px;font-weight:500;background:var(--neutral-bg);color:var(--neutral);border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.conf{background:rgba(0,151,167,.12);color:#0097a7;border-color:rgba(0,151,167,.3)}
.pill.pend{background:transparent;border-color:var(--border-dark)}
.empty{padding:64px 24px;text-align:center;color:var(--text-muted);font-weight:300}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border-dark);border-radius:var(--radius-lg);width:100%;max-width:520px;padding:40px;margin:auto}
.modal h2{font-size:22px;font-weight:500;letter-spacing:-.5px;margin-bottom:4px}
.modal .sub{margin-bottom:24px}
.m-icon{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin-bottom:20px}
.m-icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.opt{border:1px solid var(--border-dark);background:transparent;padding:14px;border-radius:var(--radius-md);cursor:pointer;font-weight:500;font-size:14px;transition:all .15s ease;text-align:center}
.opt:hover{background:var(--hover);border-color:var(--text-main)}
.opt.on{border-color:var(--text-main);background:var(--hover)}
.opt.ok.on{border-color:var(--ok);color:var(--ok)} .opt.bad.on{border-color:var(--bad);color:var(--bad)} .opt.conf.on{border-color:#0097a7;color:#0097a7;background:rgba(0,151,167,.08)}
.m-actions{display:flex;gap:10px;margin-top:8px}
.m-actions .btn{flex:1}
.hist{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);font-weight:300}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:420px;padding:48px 40px}
.login .brand{margin-bottom:32px}
.err{color:var(--bad);font-size:13px;margin-bottom:12px;min-height:18px}

  font-size: 16px !important;
}
html {
  -webkit-tap-highlight-color: transparent;
}
button, a, input, select, textarea, .seg button, .card, .row, .btn, .icon-btn {
  touch-action: manipulation;
}

/* PDF Dropzone */

.bp-paso-amount{text-align:right;flex-shrink:0;margin-left:auto}
.bp-paso-amount b{font-size:13.5px;font-weight:700;color:var(--text-main);display:block}
.bp-paso-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;display:inline-block;margin-top:2px;text-transform:uppercase;letter-spacing:.3px}

.bp-paso-badge.pend{background:var(--border);color:var(--text-muted)}
.bp-card-pasos-box{background:var(--bg-color);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.bp-pasos-mini-head{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px}
.bp-pasos-mini-list{display:flex;flex-direction:column;gap:3px;max-height:110px;overflow-y:auto}

.bp-abonos-table{background:var(--bg-color);border:1px solid var(--border-dark);border-radius:8px;overflow:hidden;max-height:160px;overflow-y:auto;font-size:12px}

.bp-wa-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.25);border-radius:10px;padding:12px 14px;margin-top:14px}

.advisor-box{background:var(--bg-color);border:1px solid var(--border-dark);border-radius:var(--radius-md);padding:14px 16px}

/* =========================================================
   RESPONSIVE MODAL & MOBILE OVERRIDES (Bottom Specificity)
   ========================================================= */
@media (max-width: 768px) {
  /* Overlay & Modal containers: stay strictly within screen boundaries */
  .overlay {
    padding: 10px 8px !important;
    align-items: flex-end !important; /* Drawer / Bottom-sheet on mobile for easy reach */
    box-sizing: border-box !important;
    overflow-x: hidden !important;
  }
  .modal {
    width: 100% !important;
    max-width: 100% !important;
    max-height: 92vh !important;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch !important;
    padding: 22px 16px 28px 16px !important;
    border-radius: 18px 18px 10px 10px !important;
    box-sizing: border-box !important;
    margin: 0 auto !important;
  }
  .modal.modal-budget {
    max-width: 100% !important;
    padding: 22px 14px 28px 14px !important;
  }
  .modal.modal-report {
    max-width: 100% !important;
    padding: 20px 14px !important;
  }

  /* Form layouts inside modals: stack cleanly into 1 column */
  .grid2 {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
  }
  .grid3-kpis {
    grid-template-columns: 1fr !important;
    gap: 10px !important;
  }
  .field {
    margin-bottom: 14px !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }
  .field .inp, .field textarea.inp, .field select.inp {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    font-size: 16px !important; /* Prevents auto-zoom on iOS */
  }

  /* Custom dropdowns inside modals */
  .c-select-wrap {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
  }
  .c-select-trigger {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
    font-size: 15px !important;
  }
  .c-select-menu {
    width: 100% !important;
    max-width: 100% !important;
    left: 0 !important;
    right: 0 !important;
    box-sizing: border-box !important;
  }

  /* Modal action buttons: wrap nicely, fit screen */
  .m-actions {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 8px !important;
    width: 100% !important;
    margin-top: 18px !important;
    box-sizing: border-box !important;
  }
  .m-actions .btn {
    flex: 1 1 calc(50% - 8px) !important;
    min-width: 110px !important;
    padding: 12px 10px !important;
    font-size: 13.5px !important;
    text-align: center !important;
    box-sizing: border-box !important;
    white-space: normal !important; /* Allow 2-line text if long like 'Guardar Presupuesto' */
  }
  .m-actions .btn[data-act="save"],
  .m-actions .btn[data-act="savebudget"] {
    flex: 2 1 100% !important; /* Make primary action full width on bottom */
    order: 4 !important;
    font-weight: 600 !important;
  }
  .m-actions .btn[data-act="close"] {
    order: 1 !important;
  }
  .m-actions .btn[data-act="budget"] {
    order: 2 !important;
  }
  .m-actions .btn[data-act="delete"],
  .m-actions .btn[data-act="delbudget"] {
    order: 3 !important;
  }

  /* WhatsApp banner inside budget modal */
  .bp-wa-banner {
    flex-direction: column !important;
    align-items: stretch !important;
    gap: 10px !important;
    padding: 12px !important;
    box-sizing: border-box !important;
  }
  .bp-wa-banner button {
    width: 100% !important;
    justify-content: center !important;
  }

  /* Presupuestos: horizontal scroll filters */
  .bp-filter-toolbar {
    display: flex !important;
    width: 100% !important;
    max-width: 100% !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    -webkit-overflow-scrolling: touch !important;
    padding: 6px 2px 14px 2px !important;
    margin-bottom: 14px !important;
    justify-content: flex-start !important;
    scrollbar-width: none !important;
  }
  .bp-filter-toolbar::-webkit-scrollbar {
    display: none !important;
  }
  .bp-pill-group {
    display: inline-flex !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
    align-items: center !important;
    justify-content: flex-start !important;
    width: max-content !important;
    min-width: 100% !important;
    gap: 8px !important;
    margin: 0 !important;
    padding: 0 4px !important;
  }
  .bp-filter-btn {
    flex: 0 0 auto !important;
    white-space: nowrap !important;
    padding: 8px 14px !important;
    font-size: 12.5px !important;
    border-radius: 999px !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    box-sizing: border-box !important;
  }
  .bp-filter-btn .bp-dot {
    width: 7px !important;
    height: 7px !important;
    border-radius: 50% !important;
    flex: 0 0 auto !important;
  }
  .bp-filter-btn .bp-count {
    font-size: 11px !important;
    padding: 2px 6px !important;
    border-radius: 10px !important;
    font-weight: 700 !important;
    flex: 0 0 auto !important;
  }
}</style>

function sanitizeAllExistingPresupuestos(){
  if(!presupuestos) return;
  let modified = false;

    if(b && Array.isArray(b.pasos) && b.pasos.some(p => p.descripcion && (p.descripcion.includes('Subtotal Dcto') || p.descripcion.includes('Estado paso') || p.descripcion.includes('Pieza(s)')))){

}


function syncPresupuestosFromCitas(loadedCitas){
  if(!Array.isArray(loadedCitas))return;
  loadedCitas.forEach(c=>{
    if(c&&c.historial&&Array.isArray(c.historial)){
      c.historial.forEach(h=>{
        if(h&&h.tipo==='presupuesto_sync'&&h.data&&h.data.folio){
          const tel=cleanTel(h.data.telefono||c.telefono);
          const key=tel||patientKey(c.telefono,c.paciente);
          if(key){
            const cur=presupuestos[key];
            const incomingDate=h.data.actualizadoEl||h.f||'';
            if(!cur||!cur.actualizadoEl||(incomingDate&&incomingDate>=cur.actualizadoEl)){
              presupuestos[key]={
                ...h.data,
                telefono:h.data.telefono||c.telefono||'',
                paciente:h.data.paciente||c.paciente||''
              };
            }
          }
        }
      });
    }
  });
  sanitizeAllExistingPresupuestos();
  savePresupuestosLocal();
}

function toRow(c){
  const asesor = nameOf(c.asesorId);
  const creador = nameOf(c.creadoPor || c.asesorId);
  let hist = Array.isArray(c.historial) ? [...c.historial] : [];
  const key = patientKey(c.telefono, c.paciente);
  if(c.paquete){
    const paqIdx = hist.findIndex(h => h && h.tipo === 'paquete_info');
    const paqItem = { f: c.creadoEl || new Date().toISOString(), e: 'Paquete: ' + c.paquete, tipo: 'paquete_info', paquete: c.paquete };
    if(paqIdx >= 0) hist[paqIdx] = paqItem;
    else hist.push(paqItem);
  }
  const b = presupuestos[key];
  if(b){
    const syncIdx = hist.findIndex(h => h && h.tipo === 'presupuesto_sync');
    const syncItem = { f: b.actualizadoEl || new Date().toISOString(), e: 'Presupuesto #' + (b.folio||''), tipo: 'presupuesto_sync', data: b };
    if(syncIdx >= 0) hist[syncIdx] = syncItem;
    else hist.push(syncItem);
  }
  if(c.sheetsId || c.sheetsAsistenciaEnviada){
    const sIdx = hist.findIndex(h => h && h.tipo === 'sheets_sync_info');
    const sItem = { f: new Date().toISOString(), tipo: 'sheets_sync_info', sheetsId: c.sheetsId || ('dmf_' + c.id), sent: !!c.sheetsAsistenciaEnviada };
    if(sIdx >= 0) hist[sIdx] = sItem;
    else hist.push(sItem);
  } else {
    const sIdx = hist.findIndex(h => h && h.tipo === 'sheets_sync_info');
    if(sIdx >= 0) hist.splice(sIdx, 1);
  }
  return {
    id: c.id,
    asesor_id: asesor,
    fecha: c.fecha,
    hora: c.hora,
    paciente: c.paciente,
    telefono: c.telefono||'',
    sucursal: c.sucursal||'',
    tratamiento: c.tratamiento||'',
    tipo: c.tipo||'Nueva',
    origen: c.origen||'',
    notas: c.notas||'',
    estatus: c.estatus||'Pendiente',
    motivo: c.motivo||'',
    creado_el: c.creadoEl||new Date().toISOString(),
    creado_por: creador,
    historial: hist
  };
}

function fromRow(r){
  const asesor = nameOf(r.asesor_id);
  const creador = nameOf(r.creado_por || r.asesor_id);
  const sInfo = Array.isArray(r.historial) ? r.historial.find(h => h && h.tipo === 'sheets_sync_info') : null;
  return {
    id: r.id || ('c_' + (r.telefono||'').replace(/\D/g,'') + '_' + (r.fecha||'') + '_' + (r.hora||'').replace(':','')),
    asesorId: asesor,

    hora: r.hora,
    paciente: r.paciente,
    telefono: r.telefono||'',
    sucursal: r.sucursal||'',

    origen: r.origen||'',
    notas: r.notas||'',
    estatus: r.estatus||'Pendiente',
    motivo: r.motivo||'',
    creadoEl: r.creado_el?new Date(r.creado_el).toISOString():new Date().toISOString(),
    creadoPor: creador,
    paquete: (Array.isArray(r.historial)?(r.historial.find(h=>h&&(h.tipo==='paquete_info'||h.paquete))||{}).paquete:null) || r.paquete || 'Individual',
    sheetsId: (sInfo ? sInfo.sheetsId : null) || r.sheetsId || (r.estatus === 'Asistió' ? ('dmf_' + r.id) : null),
    sheetsAsistenciaEnviada: (sInfo ? sInfo.sent : false) || (r.estatus === 'Asistió'),
    historial: Array.isArray(r.historial)?r.historial:[]
  };
}

let sbClient=null;
function initRealtime(){
  try{
    if(window.supabase&&window.supabase.createClient){
      sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      sbClient
        .channel('citas_channel')
        .on('postgres_changes',{event:'*',schema:'public',table:'citas'},payload=>{
          if(payload.eventType==='INSERT'){
            const incoming=fromRow(payload.new);
            if(!citas.some(c=>c.id===incoming.id || (c.telefono&&c.telefono===incoming.telefono&&c.fecha===incoming.fecha&&c.hora===incoming.hora))){
              citas.push(incoming);
              localStorage.setItem(KEY,JSON.stringify(citas));
              render();
            }
          }else if(payload.eventType==='UPDATE'||payload.eventType==='DELETE'){
            DB.loadAll().then(loaded=>{
              citas=loaded;
              render();
            });
          }
        })
        .subscribe();
    }
  }catch(err){
    console.warn('Realtime no disponible:',err);
  }
}

function isLeadRecord(c){
  if(!c) return false;
  const s = String(c.estatus || '').trim().toLowerCase();
  const t = String(c.tipo || '').trim().toLowerCase();
  if(s === 'lead' || s === 'lead whatsapp' || s === 'descartado') return true;
  if(s.startsWith('en conversaci')) return true;
  if(t === 'lead whatsapp' || t === 'lead') return true;
  return false;
}
function isRealCita(c){
  return !isLeadRecord(c);
}

const fmtMoney = n => '$' + (parseFloat(n)||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});

function computeBudgetTotals(b){
  if(!b) return {totalPagado:0, saldo:0, progreso:0};
  const abonoIni = parseFloat(b.abonoInicial) || 0;
  const cleanAbonos = (b.abonos||[]).filter(a => a.id !== 'ab_ini' && a.concepto !== 'Cita de Valoración inicial');
  const sumAbonos = cleanAbonos.reduce((acc,a)=>acc+(parseFloat(a.monto)||0), 0);
  const totalPagado = abonoIni + sumAbonos;
  const total = parseFloat(b.total) || 0;
  const saldo = Math.max(0, total - totalPagado);
  const progreso = (total > 0) ? Math.min(100, Math.round((totalPagado / total) * 1000) / 10) : 0;
  return { totalPagado, saldo, progreso };
}

function getPatientCitas(tel, name){
  const key = patientKey(tel, name);
  return citas.filter(c => isRealCita(c) && patientKey(c.telefono, c.paciente) === key)
              .sort((a,b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
}

function getBudgetOrigen(b){
  if(!b) return '';
  if(b.origen) return b.origen;
  const pCitas = getPatientCitas(b.telefono, b.paciente);
  if(pCitas.length && pCitas[0].origen) return pCitas[0].origen;
  const key = patientKey(b.telefono, b.paciente);
  const anyCita = citas.find(c => patientKey(c.telefono, c.paciente) === key && c.origen);
  return anyCita ? anyCita.origen : '';
}

function getBudgetSemáforo(b){
  const totals = computeBudgetTotals(b);
  const total = parseFloat(b?.total) || 0;
  const saldo = totals.saldo;
  const progreso = totals.progreso;
  const pasos = Array.isArray(b?.pasos) ? b.pasos : [];
  const compCount = pasos.filter(p => p.completado).length;
  const totalPasos = pasos.length;

  // 1. Completado: Saldo cubierto al 100% o todas las fases completadas
  if((total > 0 && saldo <= 0) || (totalPasos > 0 && compCount === totalPasos)){
    return {
      status:'completado',
      label:'Completado (100%)',
      color:'blue',
      icon:'<span class="bp-dot blue"></span>',
      badgeClass:'st-completado'
    };
  }

  // 2. En Tratamiento: Tiene algún abono pagado o alguna fase clínica marcada con check
  if(totals.totalPagado > 0 || compCount > 0){
    const label = totalPasos > 0
      ? `En Tratamiento (${compCount}/${totalPasos} fases · ${progreso}%)`
      : `En Tratamiento (${progreso}% pagado)`;
    return {
      status:'en_tratamiento',
      label: label,
      color:'green',
      icon:'<span class="bp-dot green"></span>',
      badgeClass:'st-tratamiento'
    };
  }

  // 3. Pendiente de inicio: Presupuesto emitido sin abonos ni fases iniciadas
  return {
    status:'pendiente',
    label:'Pendiente de Inicio (0%)',
    color:'yellow',
    icon:'<span class="bp-dot yellow"></span>',
    badgeClass:'st-valoracion'
  };
}

function computeAllBudgetsKpis(){
  const list = getMyBudgets();
  let totalPresupuestado = 0;
  let totalCobrado = 0;
  let totalSaldo = 0;
  let enTratamiento = 0;
  let pendientes = 0;
  let completados = 0;

  list.forEach(b => {
    const totals = computeBudgetTotals(b);
    totalPresupuestado += (parseFloat(b.total) || 0);
    totalCobrado += totals.totalPagado;
    totalSaldo += totals.saldo;

    const sem = getBudgetSemáforo(b);
    if(sem.status === 'en_tratamiento') enTratamiento++;
    else if(sem.status === 'completado') completados++;
    else pendientes++;
  });

  return {
    totalPresupuestado,
    totalCobrado,
    totalSaldo,
    enTratamiento,
    pendientes,
    completados,
    total: list.length
  };
}

function extractDentalinkData(text){
  const clean = text.replace(/\s+/g, ' ');

  // Folio: Presupuesto nº 4860, PDT.: nº 4860, #4860, etc.
  const folioMatch = clean.match(/(?:Presupuesto|PDT\.?|Folio)\s*(?:n[ºo°]|#|num\.?|núm\.?)?\s*[:\-]?\s*(\d+)/i) 
                  || clean.match(/#\s*(\d{3,7})/);
  const folio = folioMatch ? folioMatch[1] : '';

  // Patient name: Nombre: HECTOR JAVIER FONSECA PANTOJA
  const pacMatch = clean.match(/(?:Paciente\s*:\s*)?Nombre\s*:\s*([A-Za-zÁÉÍÓÚáéíóúñÑüÜ\s]+?)(?=\s*(?:Fecha|RUT|CURP|Edad|Tel|Email|Doctor|Convenio|Tratamiento|$))/i)
                || clean.match(/Paciente\s*:\s*([A-Za-zÁÉÍÓÚáéíóúñÑüÜ\s]+?)(?=\s*(?:Fecha|RUT|CURP|Edad|Tel|Email|Doctor|Convenio|Tratamiento|$))/i);
  const paciente = pacMatch ? pacMatch[1].trim() : '';

  // Total presupuesto: Total del presupuesto $ 17,750.00
  const totalMatch = clean.match(/Total\s+del\s+presupuesto\s+\$?\s*([\d,]+(?:\.\d{2})?)/i)
                  || clean.match(/Total\s+\$?\s*([\d,]+(?:\.\d{2})?)/i);
  const totalStr = totalMatch ? totalMatch[1].replace(/,/g, '') : '0';
  const total = parseFloat(totalStr) || 0;

  // Abonos: Abonos del paciente (-) $ 550.00
  const abonoMatch = clean.match(/Abonos(?:\s+del\s+paciente)?\s*(?:\(-\)\s*)?\$?\s*([\d,]+(?:\.\d{2})?)/i);
  const abonoStr = abonoMatch ? abonoMatch[1].replace(/,/g, '') : '0';
  const abono = parseFloat(abonoStr) || 0;

  // Saldo por pagar: Total por pagar $ 17,200.00
  const saldoMatch = clean.match(/Total\s+por\s+pagar\s+\$?\s*([\d,]+(?:\.\d{2})?)/i)
                  || clean.match(/Saldo\s+por\s+pagar\s+\$?\s*([\d,]+(?:\.\d{2})?)/i);
  const saldoStr = saldoMatch ? saldoMatch[1].replace(/,/g, '') : '';
  const saldo = saldoStr ? (parseFloat(saldoStr) || 0) : Math.max(0, total - abono);

  // Fases o procedimientos clínicos del presupuesto de Dentalink
  const pasos = [];
  const statusWords = 'Realizada|Realizado|Pendiente|Planificada|Planificado|Presupuestada|Presupuestado|Iniciada|Iniciado|Anulada|Anulado';

  // Dividir el texto en bloques por cada palabra de estado en Dentalink
  const splitRegex = new RegExp(`(?<=\\s|^)(?=(?:${statusWords})\\b)`, 'i');
  const chunks = clean.split(splitRegex);

  let num = 1;
  const statusStartRegex = new RegExp(`^(${statusWords})\\s+`, 'i');
  // Patrón para capturar: descripción/piezas + subtotal + descuento + total de la fila
  const rowPattern = /^(.+?)\s+\$?\s*([\d,]+(?:\.\d{2})?)\s+(?:[\d\.]+\%|\-|\$?[\d,]+(?:\.\d{2})?)\s+\$?\s*([\d,]+(?:\.\d{2})?)/i;

  for (const rawChunk of chunks) {
    const chunk = (rawChunk || '').trim();
    if (!chunk) continue;

    const mStatus = chunk.match(statusStartRegex);
    if (!mStatus) continue;

    const estadoRaw = mStatus[1].trim();
    const body = chunk.substring(mStatus[0].length).trim();

    const mRow = body.match(rowPattern);
    if (mRow) {
      let descAndPiece = mRow[1].trim();
      const rowTotal = parseFloat(mRow[3].replace(/,/g, '')) || 0;

      // Limpiar encabezados de tabla de Dentalink que se hayan colado al inicio de la descripción
      descAndPiece = descAndPiece.replace(/^.*?Pieza\(s\)\s+Subtotal\s+Dcto\.\s+Total\s*/i, '').trim();

      let cleanDesc = descAndPiece;
      let piezas = '';

      // Si termina en guión "-" (Dentalink pone "-" cuando no aplica pieza dental)
      if (cleanDesc.endsWith('-') || cleanDesc.endsWith('–') || cleanDesc.endsWith('—')) {
        cleanDesc = cleanDesc.replace(/[-–—]\s*$/, '').trim();
      } else {
        // Si termina con número de pieza dental (ej: 1.3, 4.3, 11, 21, 14, etc.)
        const pieceMatch = cleanDesc.match(/\s+([1-4]\.[1-8]|[1-8]{2})\s*$/);
        if (pieceMatch) {
          piezas = pieceMatch[1].trim();
          cleanDesc = cleanDesc.slice(0, -pieceMatch[0].length).trim();
        } else {
          // Fallback con palabra Pieza / Pza
          const pieceWordMatch = cleanDesc.match(/\s+(?:Pieza\(s\)|Pieza|Pza)?\s*[:\-]?\s*([1-4]\.[1-8]|[1-8]{2})\s*$/i);
          if (pieceWordMatch) {
            piezas = pieceWordMatch[1].trim();
            cleanDesc = cleanDesc.slice(0, -pieceWordMatch[0].length).trim();
          }
        }
      }

      // Limpiar guión residual al final si quedó
      cleanDesc = cleanDesc.replace(/[-–—]\s*$/, '').trim();

      const isCompleted = /^Realizada|^Realizado/i.test(estadoRaw);

      if (cleanDesc && rowTotal >= 0) {
        pasos.push({
          numero: num++,
          descripcion: cleanDesc,
          piezas: piezas,
          monto: rowTotal,
          estado: estadoRaw,
          completado: isCompleted
        });
      }
    }
  }

  // Fallback si no venía en formato de tabla Dentalink pero venía texto con PASO 1, FASE 1, etc.
  if (!pasos.length) {
    const pasoRegex = /(?:PASO|FASE)\s+(\d+)\s*[:\-–—]?\s*([^$]*?)\$?\s*([\d,]+(?:\.\d{2})?)/gi;
    let pm;
    while ((pm = pasoRegex.exec(clean)) !== null) {
      pasos.push({
        numero: parseInt(pm[1], 10),
        descripcion: (pm[2] || '').trim() || `Paso ${pm[1]}`,
        piezas: '',
        monto: parseFloat(pm[3].replace(/,/g, '')) || 0,
        estado: 'Pendiente',
        completado: false
      });
    }
  }

  return { folio, paciente, total, abono, saldo, pasos };
}

async function parseDentalinkPDFFile(file){
  if(!window.pdfjsLib){
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
      s.onload = () => {
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        } catch(e){}
        resolve();
      };
      s.onerror = () => reject(new Error('No se pudo cargar el lector de PDFs'));
      document.head.appendChild(s);
    });
  }
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const str = content.items.map(it => it.str).join(' ');
    fullText += '\n' + str;
  }
  return extractDentalinkData(fullText);
}

function formatWeekTitle(wStart,wEnd,isStd){
  const d1=new Date(wStart+'T12:00:00');
  const d2=new Date(wEnd+'T12:00:00');

  const day2=d2.getDate();
  const m1=d1.getMonth();
  const m2=d2.getMonth();
  const dName1=isStd?'Lun':'Jue';
  const dName2=isStd?'Dom':'Mié';
  if(m1===m2){
    return `${dName1} ${day1} al ${dName2} ${day2} de ${longMonths[m2]}`;
  }
  return `${dName1} ${day1} ${shortMonths[m1]} al ${dName2} ${day2} ${shortMonths[m2]}`;
}
function formatWeekOption(sStart,sEnd,isStd,isThisWeek){
  const d1=new Date(sStart+'T12:00:00');

}
const getDmfWeekRange=s=>{const d=new Date(s+'T12:00:00');const day=d.getDay();const diff=(day-4+7)%7;const thu=new Date(d);thu.setDate(d.getDate()-diff);const wed=new Date(thu);wed.setDate(thu.getDate()+6);return [iso(thu),iso(wed)]};
const getStdWeekRange=s=>{const d=new Date(s+'T12:00:00');const day=d.getDay();const diff=(day===0?-6:1-day);const mon=new Date(d);mon.setDate(d.getDate()+diff);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return [iso(mon),iso(sun)]};
let weekMode='dmf';
try{weekMode=localStorage.getItem('dmf_week_mode')||'dmf'}catch(e){}
const getWeekRange=s=>(weekMode==='std'?getStdWeekRange(s):getDmfWeekRange(s));
const getMonthRange=s=>{const d=new Date(s+'T12:00:00');const y=d.getFullYear(),m=d.getMonth();const first=new Date(y,m,1);const last=new Date(y,m+1,0);return [iso(first),iso(last)]};
const addMonths=(s,n)=>{const d=new Date(s+'T12:00:00');d.setMonth(d.getMonth()+n);return iso(d)};
const uid=()=>'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);

function enhanceSelect(sel){
  if(!sel || sel.dataset.enhanced) return;
  sel.dataset.enhanced='true';
  sel.style.cssText='position:absolute!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important;padding:0!important;border:0!important;margin:0!important;';

  const wrap=document.createElement('div');
  wrap.className='c-select-wrap';
  if(sel.id) wrap.dataset.for=sel.id;

  const trigger=document.createElement('button');
  trigger.type='button';
  trigger.className='c-select-trigger '+(sel.className||'');

  const label=document.createElement('span');
  label.className='c-select-label';

  const arrow=document.createElement('span');
  arrow.className='c-select-arrow';
  arrow.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

  trigger.appendChild(label);
  trigger.appendChild(arrow);

  const menu=document.createElement('div');
  menu.className='c-select-menu hidden';

  sel.parentNode.insertBefore(wrap,sel);
  wrap.appendChild(trigger);
  wrap.appendChild(menu);
  wrap.appendChild(sel);

  function updateMenu(){
    const opts=Array.from(sel.options);
    const currVal=sel.value;
    const selectedOpt=sel.selectedOptions[0]||opts[0];
    label.textContent=selectedOpt?selectedOpt.textContent:'';

    const hasValue=!!(sel.value && sel.value!=='todos');
    trigger.classList.toggle('has-val', sel.classList.contains('has-val') || hasValue);

    menu.innerHTML=opts.map(opt=>{
      const isSelected=(opt.value===currVal || (!currVal && !opt.value && opt===selectedOpt));
      return `<div class="c-select-opt ${isSelected?'selected':''}" data-val="${esc(opt.value)}">
        <span class="c-select-opt-text">${esc(opt.textContent)}</span>
        ${isSelected?'<svg class="c-select-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':''}
      </div>`;
    }).join('');
  }

  trigger.onclick=e=>{
    e.stopPropagation();
    const isOpen=!menu.classList.contains('hidden');
    closeAllCustomDropdowns();
    if(!isOpen){
      updateMenu();
      menu.classList.remove('hidden');
      trigger.classList.add('open');
      const active=menu.querySelector('.c-select-opt.selected');
      if(active) active.scrollIntoView({block:'nearest'});
    }
  };

  menu.onclick=e=>{
    e.stopPropagation();
    const optEl=e.target.closest('.c-select-opt');
    if(!optEl) return;
    const val=optEl.dataset.val;
    if(sel.value!==val){
      sel.value=val;
      sel.dispatchEvent(new Event('change',{bubbles:true}));
      sel.dispatchEvent(new Event('input',{bubbles:true}));
    }
    updateMenu();
    menu.classList.add('hidden');
    trigger.classList.remove('open');
  };

  try{
    const observer=new MutationObserver(()=>updateMenu());
    observer.observe(sel,{childList:true,subtree:true,characterData:true});
  }catch(err){}

  sel._syncCustomSelect=updateMenu;
  updateMenu();
}

function attachMonthPicker(wrapEl, initialYm, onSelect){
  if(!wrapEl) return;
  const trigger=wrapEl.querySelector('.cmp-trigger');
  const popover=wrapEl.querySelector('.cmp-popover');
  let currentYm=initialYm.slice(0,7);
  let viewYear=parseInt(currentYm.slice(0,4),10)||new Date().getFullYear();

  function update(){
    renderMonthPickerContent(popover, viewYear, currentYm);
  }

  trigger.onclick=e=>{
    e.stopPropagation();
    const isOpen=!popover.classList.contains('hidden');
    closeAllCustomDropdowns();
    if(!isOpen){
      viewYear=parseInt(currentYm.slice(0,4),10)||new Date().getFullYear();
      update();
      popover.classList.remove('hidden');
      trigger.classList.add('open');
    }
  };

  popover.onclick=e=>{
    e.stopPropagation();
    const btnNav=e.target.closest('.cmp-nav-btn');
    if(btnNav){
      if(btnNav.dataset.act==='prev') viewYear--;
      if(btnNav.dataset.act==='next') viewYear++;
      update();
      return;
    }
    const btnToday=e.target.closest('.cmp-today-btn');
    if(btnToday){
      const now=new Date();
      const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      currentYm=ym;
      popover.classList.add('hidden');
      trigger.classList.remove('open');
      onSelect(ym);
      return;
    }
    const mBtn=e.target.closest('.cmp-m-btn');
    if(mBtn){
      const ym=mBtn.dataset.ym;
      currentYm=ym;
      popover.classList.add('hidden');
      trigger.classList.remove('open');
      onSelect(ym);
      return;
    }
};
}

const CDP_MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const CDP_DAY_NAMES = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];

function formatDateDisplay(val){
  if(!val || typeof val !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(val)) return '';
  const [y, m, d] = val.split('-').map(Number);
  const dt = new Date(y, m - 1, d, 12, 0, 0);
  if(isNaN(dt.getTime())) return val;
  const wd = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][dt.getDay()];
  const mos = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${wd}, ${d} ${mos[m - 1]} ${y}`;
}

      label.textContent = inp.placeholder || inp.title || 'Seleccionar fecha';
      label.classList.add('placeholder');
    }

  function renderCalendar(){
    const selVal = inp.value || '';
    const nowIso = iso(new Date());

    const titleStr = `${CDP_MONTH_NAMES[viewMonth]} ${viewYear}`;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const firstDayIndex = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;

    let daysHtml = '';

    for(let i = firstDayIndex - 1; i >= 0; i--){
      const dNum = daysInPrevMonth - i;
      const prevM = viewMonth === 0 ? 11 : viewMonth - 1;
      const prevY = viewMonth === 0 ? viewYear - 1 : viewYear;
      const dIso = `${prevY}-${String(prevM + 1).padStart(2,'0')}-${String(dNum).padStart(2,'0')}`;

    const filledCells = firstDayIndex + daysInMonth;
    const totalCells = Math.ceil(filledCells / 7) * 7;
    const nextDaysCount = totalCells - filledCells;
    for(let d = 1; d <= nextDaysCount; d++){
      const nextM = viewMonth === 11 ? 0 : viewMonth + 1;

        <button type="button" class="cdp-btn-action" data-act="today">Hoy</button>
      </div>
    `;
  }

  function adjustPopoverPosition(){
    popover.style.left = '0';
    popover.style.right = 'auto';
    const rect = popover.getBoundingClientRect();
    if(rect.right > (window.innerWidth || document.documentElement.clientWidth) - 12){
      popover.style.left = 'auto';
      popover.style.right = '0';
    }
  }

  trigger.onclick = e => {
    e.stopPropagation();
    const isOpen = !popover.classList.contains('hidden');
    closeAllCustomDropdowns();
    if(!isOpen){
      const current = inp.value || iso(new Date());
      viewYear = parseInt(current.slice(0, 4), 10) || new Date().getFullYear();
      viewMonth = (parseInt(current.slice(5, 7), 10) - 1);
      if(isNaN(viewMonth) || viewMonth < 0 || viewMonth > 11) viewMonth = new Date().getMonth();
      renderCalendar();
      popover.classList.remove('hidden');
      trigger.classList.add('open');
      adjustPopoverPosition();
    }
  };

  popover.onclick = e => {
    e.stopPropagation();
    const btnNav = e.target.closest('.cdp-nav');
    if(btnNav){
      if(btnNav.dataset.act === 'prev'){
        viewMonth--;
        if(viewMonth < 0){ viewMonth = 11; viewYear--; }
      } else if(btnNav.dataset.act === 'next'){
        viewMonth++;
        if(viewMonth > 11){ viewMonth = 0; viewYear++; }
      }
      renderCalendar();
      return;
    }

    const btnClear = e.target.closest('[data-act="clear"]');
    if(btnClear){
      inp.value = '';
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true }));
      updateTrigger();
      popover.classList.add('hidden');
      trigger.classList.remove('open');
      return;
    }

    const btnToday = e.target.closest('[data-act="today"]');
    if(btnToday){
      const t = iso(new Date());
      inp.value = t;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true }));
      updateTrigger();
      popover.classList.add('hidden');
      trigger.classList.remove('open');
      return;
    }

    const dayBtn = e.target.closest('.cdp-day');
    if(dayBtn && dayBtn.dataset.date){
      inp.value = dayBtn.dataset.date;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true }));
      updateTrigger();
      popover.classList.add('hidden');
      trigger.classList.remove('open');
      return;
    }
  };

  inp._syncCustomPicker = updateTrigger;
  updateTrigger();
}

function formatTimeDisplay(val){
  if(!val || typeof val !== 'string' || !val.includes(':')) return '';
  const parts = val.split(':');
  let h = parseInt(parts[0], 10);
  const m = parts[1].slice(0, 2);
  if(isNaN(h)) return val;
  const ampm = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return `${String(h12).padStart(2, '0')}:${m} ${ampm}`;
}

function parseTimeToParts(val){
  let h12 = 10, m = '00', ampm = 'AM';
  if(val && typeof val === 'string' && val.includes(':')){
    const parts = val.split(':');
    let h = parseInt(parts[0], 10);
    if(!isNaN(h)){
      ampm = h >= 12 ? 'PM' : 'AM';
      h12 = h % 12;
      if(h12 === 0) h12 = 12;
    }
    const parsedM = parseInt(parts[1], 10);
    if(!isNaN(parsedM)){
      const roundedM = Math.round(parsedM / 15) * 15;
      m = roundedM >= 60 ? '00' : String(roundedM).padStart(2, '0');
    }
  }
  return { h12, m, ampm };
}

function to24h(h12, mStr, ampm){
  let h = parseInt(h12, 10);
  if(ampm === 'PM' && h < 12) h += 12;
  if(ampm === 'AM' && h === 12) h = 0;
  return `${String(h).padStart(2, '0')}:${String(mStr).padStart(2, '0')}`;
}

const CTP_PRESETS = [
  '09:00 AM','10:00 AM','11:00 AM','12:00 PM',
  '01:00 PM','02:00 PM','03:00 PM','04:00 PM',
  '05:00 PM','06:00 PM'
];

function enhanceTimePicker(inp){
  if(!inp || inp.dataset.enhanced) return;
  inp.dataset.enhanced = 'true';
  inp.style.cssText = 'position:absolute!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important;padding:0!important;border:0!important;margin:0!important;';

  const wrap = document.createElement('div');
  wrap.className = 'ctp-wrap';
  if(inp.id) wrap.dataset.for = inp.id;

  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'ctp-trigger ' + (inp.className || '');

  const leftBox = document.createElement('div');
  leftBox.style.cssText = 'display:flex;align-items:center;gap:8px;overflow:hidden;flex:1 1 auto;';

  const icon = document.createElement('span');
  icon.className = 'ctp-icon';
  icon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

  const label = document.createElement('span');
  label.className = 'ctp-label';

  leftBox.appendChild(icon);
  leftBox.appendChild(label);

  const chevron = document.createElement('span');
  chevron.className = 'ctp-chevron';
  chevron.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

  trigger.appendChild(leftBox);
  trigger.appendChild(chevron);

  const popover = document.createElement('div');
  popover.className = 'ctp-popover hidden';

  inp.parentNode.insertBefore(wrap, inp);
  wrap.appendChild(trigger);
  wrap.appendChild(popover);
  wrap.appendChild(inp);

  let tempH12 = 10, tempM = '00', tempAmPm = 'AM';

  function updateTrigger(){
    const val = inp.value;
    const hasVal = !!val;
    trigger.classList.toggle('has-val', hasVal);
    if(hasVal){
      label.textContent = formatTimeDisplay(val);
      label.classList.remove('placeholder');
    } else {
      label.textContent = inp.placeholder || inp.title || 'Seleccionar hora';
      label.classList.add('placeholder');
    }
  }

  function commitValue(h12, mStr, ampm, closeAfter = false){
    const val24 = to24h(h12, mStr, ampm);
    inp.value = val24;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    inp.dispatchEvent(new Event('change', { bubbles: true }));
    updateTrigger();
    if(closeAfter){
      popover.classList.add('hidden');
      trigger.classList.remove('open');
    } else {
      renderContent();
    }
  }

  function renderContent(){
    const displayStr = `${String(tempH12).padStart(2,'0')}:${String(tempM).padStart(2,'0')} ${tempAmPm}`;

    let hoursHtml = '';
    for(let h = 1; h <= 12; h++){
      const isSel = (h === tempH12);
      const hStr = String(h).padStart(2, '0');
      hoursHtml += `<button type="button" class="ctp-val-btn ${isSel?'selected':''}" data-hour="${h}">${hStr}</button>`;
    }

    const minutesList = ['00','15','30','45'];
    let minHtml = '';
    minutesList.forEach(m => {
      const isSel = (String(tempM).padStart(2,'0') === m);
      minHtml += `<button type="button" class="ctp-val-btn ${isSel?'selected':''}" data-min="${m}">${m}</button>`;
    });

    const presetsHtml = CTP_PRESETS.map(p => `<button type="button" class="ctp-preset-btn" data-preset="${p}">${p}</button>`).join('');

    popover.innerHTML = `
      <div class="ctp-header">
        <span class="ctp-display">${displayStr}</span>
        <div class="ctp-ampm-seg">
          <button type="button" class="ctp-ampm-btn ${tempAmPm==='AM'?'active':''}" data-ampm="AM">AM</button>
          <button type="button" class="ctp-ampm-btn ${tempAmPm==='PM'?'active':''}" data-ampm="PM">PM</button>
        </div>
      </div>
      <div class="ctp-columns">
        <div>
          <div class="ctp-col-title">Hora</div>
          <div class="ctp-col-list ctp-col-hours">${hoursHtml}</div>
        </div>
        <div>
          <div class="ctp-col-title">Minuto</div>
          <div class="ctp-col-list ctp-col-mins">${minHtml}</div>
        </div>
      </div>
      <div class="ctp-presets">${presetsHtml}</div>
      <div class="ctp-footer">
        <button type="button" class="cdp-btn-action clear" data-act="clear">Borrar</button>
        <div style="display:flex;gap:6px">
          <button type="button" class="cdp-btn-action" data-act="now">Ahora</button>
          <button type="button" class="cdp-btn-action" data-act="done" style="background:var(--btn-bg);color:var(--btn-text);padding:4px 10px;border-radius:6px">Aceptar</button>
        </div>
      </div>
    `;

    setTimeout(()=>{
      const selH = popover.querySelector('.ctp-col-hours .selected');
      if(selH) selH.scrollIntoView({block:'nearest'});
      const selM = popover.querySelector('.ctp-col-mins .selected');
      if(selM) selM.scrollIntoView({block:'nearest'});
    }, 0);
  }

  function adjustPopoverPosition(){
    popover.style.left = '0';
    popover.style.right = 'auto';
    const rect = popover.getBoundingClientRect();
    if(rect.right > (window.innerWidth || document.documentElement.clientWidth) - 12){
      popover.style.left = 'auto';
      popover.style.right = '0';
    }
  }

  trigger.onclick = e => {
    e.stopPropagation();
    const isOpen = !popover.classList.contains('hidden');
    closeAllCustomDropdowns();
    if(!isOpen){
      const parsed = parseTimeToParts(inp.value);
      tempH12 = parsed.h12;
      tempM = parsed.m;
      tempAmPm = parsed.ampm;
      renderContent();
      popover.classList.remove('hidden');
      trigger.classList.add('open');
      adjustPopoverPosition();
    }
  };

  popover.onclick = e => {
    e.stopPropagation();

    const ampmBtn = e.target.closest('.ctp-ampm-btn');
    if(ampmBtn){
      tempAmPm = ampmBtn.dataset.ampm;
      commitValue(tempH12, tempM, tempAmPm, false);
      return;
    }

    const hBtn = e.target.closest('[data-hour]');
    if(hBtn){
      tempH12 = parseInt(hBtn.dataset.hour, 10);
      commitValue(tempH12, tempM, tempAmPm, false);
      return;
    }

    const mBtn = e.target.closest('[data-min]');
    if(mBtn){
      tempM = mBtn.dataset.min;
      commitValue(tempH12, tempM, tempAmPm, false);
      return;
    }

    const pBtn = e.target.closest('[data-preset]');
    if(pBtn){
      const [hStr, rest] = pBtn.dataset.preset.split(':');
      const [mStr, ampm] = rest.split(' ');
      tempH12 = parseInt(hStr, 10);
      tempM = mStr;
      tempAmPm = ampm;
      commitValue(tempH12, tempM, tempAmPm, true);
      return;
    }

    const clearBtn = e.target.closest('[data-act="clear"]');
    if(clearBtn){
      inp.value = '';
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true }));
      updateTrigger();
      popover.classList.add('hidden');
      trigger.classList.remove('open');
      return;
    }

    const nowBtn = e.target.closest('[data-act="now"]');
    if(nowBtn){
      const now = new Date();
      let nowH = now.getHours();
      let nowM = Math.round(now.getMinutes() / 15) * 15;
      if(nowM >= 60){ nowM = 0; nowH++; }
      const ampm = nowH >= 12 ? 'PM' : 'AM';
      let h12 = nowH % 12;
      if(h12 === 0) h12 = 12;
      tempH12 = h12;
      tempM = String(nowM).padStart(2, '0');
      tempAmPm = ampm;
      commitValue(tempH12, tempM, tempAmPm, true);
      return;
    }

    const doneBtn = e.target.closest('[data-act="done"]');
    if(doneBtn){
      commitValue(tempH12, tempM, tempAmPm, true);
      return;
    }
  };

  inp._syncCustomPicker = updateTrigger;
  updateTrigger();
}

function doLogin(){
  try { if(document.activeElement) document.activeElement.blur(); } catch(e){}
  const pin=($('#lg-pin').value||'').trim();
  const selEl=$('#lg-user');
  let selId=selEl?selEl.value:'';
  let u=USUARIOS.find(x=>x.id===selId);

  // ValidaciÃ³n de PIN para cada asesor
  // Edgar: PIN oficial 4321 (con tolerancia de transiciÃ³n a 1234 si el navegador tiene versiÃ³n previa en cachÃ©)
  // Miguel: PIN 1234
  const checkPin=(usr,p)=>{
    if(!usr||!p) return false;
    if(usr.id==='u2') return p==='4321'||p==='1234';
    return usr.pin===p;
  };

  // Si el usuario seleccionado en el dropdown no coincide con el PIN ingresado:
  // Auto-detectar si el PIN corresponde a otro usuario (ej: dejaron seleccionado Miguel pero teclearon el 4321 de Edgar)
  if(!checkPin(u,pin)){
    const autoUser=USUARIOS.find(x=>checkPin(x,pin));
    if(autoUser){
      u=autoUser;
      if(selEl){
        selEl.value=u.id;
        selEl._syncCustomSelect?.();
      }
    }
  }

  if(checkPin(u,pin)){
    user=u;sessionStorage.setItem('dmf_user',u.id);localStorage.setItem('dmf_last_user',u.id);startApp();
  }else{
    $('#lg-err').textContent='PIN incorrecto';
  }

function currentList(){
  const t=iso(new Date());let l=mine();

  else if(view==='mes')l=l.filter(c=>c.fecha>=mStart&&c.fecha<=mEnd);

  const d=$('#f-date')?$('#f-date').value:'';
  const dType=$('#f-date-type')?$('#f-date-type').value:'cita';

  const ori=$('#f-ori')?$('#f-ori').value:'';
  const as=$('#f-as')?$('#f-as').value:'';
  if(q)l=l.filter(c=>c.paciente.toLowerCase().includes(q)||c.telefono.includes(q));
  if(d){
    if(dType==='registro') l=l.filter(c=>(c.creadoEl||'').slice(0,10)===d);
    else l=l.filter(c=>c.fecha===d);
  }
  if(st)l=l.filter(c=>c.estatus===st);
  if(su)l=l.filter(c=>c.sucursal===su);
  if(tip)l=l.filter(c=>c.tipo===tip);
  if(ori)l=l.filter(c=>c.origen===ori);

  const sortMode=$('#f-sort')?$('#f-sort').value:'cita_asc';
  return l.sort((a,b)=>{
    if(sortMode==='reg_desc')return(b.creadoEl||'').localeCompare(a.creadoEl||'');

    if(sortMode==='cita_desc')return(b.fecha+b.hora).localeCompare(a.fecha+a.hora);
    return(a.fecha+a.hora).localeCompare(b.fecha+b.hora);
  });
}

    $('#b-week-curr').onclick=()=>{selectedWeekRef=iso(new Date());render()};
    $('#sel-week-dropdown').onchange=e=>{selectedWeekRef=e.target.value;render()};
    $('#seg-week-mode').onclick=e=>{

  if(view==='mes'){

    box.innerHTML=`

        <div class="period-bar-left">
          <div class="p-btn-group">

              <span class="p-nav-txt">Anterior</span>
            </button>
