<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Inicio</title>
  <link rel="icon" type="image/png" href="logo-dental-facil.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#F8FAFC;
      --surface:#FFFFFF;
      --text:#0F172A;
      --text-muted:#64748B;
      --btn-bg:#0F172A;
      --btn-bg-hover:#1E293B;
      --btn-text:#FFFFFF;
      --border:#E2E8F0;
      --radius:12px;
      --shadow:0 4px 16px rgba(0,0,0,.04);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;}
    .brand{display:flex;align-items:center;gap:12px;}
    .brand img{height:36px;width:auto;max-width:100%;object-fit:contain;}
    .brand span{font-weight:600;font-size:1rem;color:var(--text);}
    .content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;margin:12px 0;background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:var(--radius);font-size:1rem;font-weight:500;cursor:pointer;text-decoration:none;box-shadow:var(--shadow);transition:background .15s ease,transform .1s ease;}
    .btn:hover{background:var(--btn-bg-hover);transform:translateY(-2px);}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo-dental-facil.png" alt="Logo">
      <span>Dental MÁS FÁCIL</span>
    </div>
  </header>
  <div class="content">
    <a class="btn" href="recepcion-pwa/index.html">Recepción</a>
    <a class="btn" href="citas.html">Citas</a>
  </div>
</body>
</html>
