<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Inicio · Dental MÁS FÁCIL</title>
  <link rel="icon" type="image/png" href="logo-dental-facil.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-color:#F8FAFC;
      --surface:#FFFFFF;
      --text-main:#0F172A;
      --text-muted:#64748B;
      --text-light:#94A3B8;
      --border:#F1F5F9;
      --border-dark:#E2E8F0;
      --hover:#F8FAFC;
      --btn-bg:#0F172A;
      --btn-bg-hover:#1E293B;
      --btn-text:#FFFFFF;
      --ok:#10B981;
      --ok-bg:#ECFDF5;
      --bad:#EF4444;
      --bad-bg:#FEF2F2;
      --neutral:#64748B;
      --neutral-bg:#F1F5F9;
      --radius-lg:24px;
      --radius-md:12px;
      --shadow:0 4px 20px rgba(0,0,0,.02);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg-color);color:var(--text-main);font-weight:400;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
    .nav{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:14px 32px;gap:12px;}
    .brand{display:flex;align-items:center;gap:14px;margin-left:12px;}
    .brand img{height:34px;width:auto;display:block}
    .brand-lg img{height:36px;width:auto;max-width:100%;object-fit:contain;display:block}
    .btn{border:0;background:var(--btn-bg);color:var(--btn-text);padding:13px 22px;border-radius:var(--radius-md);font-weight:500;cursor:pointer;transition:background .15s ease, border-color .15s ease, opacity .15s ease;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
    @media (hover: hover) and (pointer: fine){
      .btn:hover{background:var(--btn-bg-hover)}
    }
    .content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
    .nav-btn {
        display:inline-block;
        padding:8px 12px;
        margin:8px;
        background-color:#0069d9;
        color:#fff;
        border:none;
        border-radius:4px;
        text-decoration:none;
        font-size:1rem;
        font-weight:500;
        cursor:pointer;
        transition:background .15s ease;
    }
    .nav-btn:hover{background-color:#004c9e;}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="brand">
      <img src="logo-dental-facil.png" alt="Logo">
      <span>Dental MÁS FÁCIL</span>
    </div>
  </nav>
  <div class="content">
    <a class="nav-btn" href="recepcion-pwa/index.html">Recepción</a>
    <a class="nav-btn" href="citas.html">Citas</a>
  </div>
</body>
</html>
