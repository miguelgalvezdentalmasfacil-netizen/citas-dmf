function enhanceTimePicker(inp){
  if(!inp || inp.dataset.enhanced) return;
  inp.dataset.enhanced = 'true';
  inp.style.cssText = 'position:absolute!important;opacity:0!important;pointer-events:none!important;width:0!important;height:0!important;padding:0!important;border:0!important;margin:0!important;';

  const wrap = document.createElement('div');
  wrap.className = 'ctp-wrap';
  if(inp.id) wrap.dataset.for = inp.id;

  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'ctp-trigger ' + (inp.className || '');

  const leftBox = document.createElement('div');
  leftBox.style.cssText = 'display:flex;align-items:center;gap:8px;overflow:hidden;flex:1 1 auto;';

  const icon = document.createElement('span');
  icon.className = 'ctp-icon';
  icon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

  const label = document.createElement('span');
  label.className = 'ctp-label';

  leftBox.appendChild(icon);
  leftBox.appendChild(label);

  const chevron = document.createElement('span');
  chevron.className = 'ctp-chevron';
  chevron.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

  trigger.appendChild(leftBox);
  trigger.appendChild(chevron);

  const popover = document.createElement('div');
  popover.className = 'ctp-popover hidden';

  inp.parentNode.insertBefore(wrap, inp);
  wrap.appendChild(trigger);
  wrap.appendChild(popover);
  wrap.appendChild(inp);

  let tempH12 = 10, tempM = '00', tempAmPm = 'AM';

  function updateTrigger(){
    const val = inp.value;
    const hasVal = !!val;
    trigger.classList.toggle('has-val', hasVal);
    if(hasVal){
      label.textContent = formatTimeDisplay(val);
      label.classList.remove('placeholder');
    } else {
      label.textContent = inp.placeholder || inp.title || 'Seleccionar hora';
      label.classList.add('placeholder');
    }
  }

  function commitValue(h12, mStr, ampm, closeAfter = false){
    const val24 = to24h(h12, mStr, ampm);
    inp.value = val24;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    inp.dispatchEvent(new Event('change', { bubbles: true }));
    updateTrigger();
    if(closeAfter){
      popover.classList.add('hidden');
      trigger.classList.remove('open');
    } else {
      renderContent();
    }
  }

  function renderContent(){
    const displayStr = `${String(tempH12).padStart(2,'0')}:${String(tempM).padStart(2,'0')} ${tempAmPm}`;

    let hoursHtml = '';
    for(let h = 1; h <= 12; h++){
      const isSel = (h === tempH12);
      const hStr = String(h).padStart(2, '0');
      hoursHtml += `<button type="button" class="ctp-val-btn ${isSel?'selected':''}" data-hour="${h}">${hStr}</button>`;
    }

    const minutesList = ['00','15','30','45'];
    let minHtml = '';
    minutesList.forEach(m => {
      const isSel = (String(tempM).padStart(2,'0') === m);
      minHtml += `<button type="button" class="ctp-val-btn ${isSel?'selected':''}" data-min="${m}">${m}</button>`;
    });

    const presetsHtml = CTP_PRESETS.map(p => `<button type="button" class="ctp-preset-btn" data-preset="${p}">${p}</button>`).join('');

    popover.innerHTML = `
      <div class="ctp-header">
        <span class="ctp-display">${displayStr}</span>
        <div class="ctp-ampm-seg">
          <button type="button" class="ctp-ampm-btn ${tempAmPm==='AM'?'active':''}" data-ampm="AM">AM</button>
          <button type="button" class="ctp-ampm-btn ${tempAmPm==='PM'?'active':''}" data-ampm="PM">PM</button>
        </div>
      </div>
      <div class="ctp-columns">
        <div>
          <div class="ctp-col-title">Hora</div>
          <div class="ctp-col-list ctp-col-hours">${hoursHtml}</div>
        </div>
        <div>
          <div class="ctp-col-title">Minuto</div>
          <div class="ctp-col-list ctp-col-mins">${minHtml}</div>
        </div>
      </div>
      <div class="ctp-presets">${presetsHtml}</div>
      <div class="ctp-footer">
        <button type="button" class="cdp-btn-action clear" data-act="clear">Borrar</button>
        <div style="display:flex;gap:6px">
          <button type="button" class="cdp-btn-action" data-act="now">Ahora</button>
          <button type="button" class="cdp-btn-action" data-act="done" style="background:var(--btn-bg);color:var(--btn-text);padding:4px 10px;border-radius:6px">Aceptar</button>
        </div>
      </div>
    `;

    setTimeout(()=>{
      const selH = popover.querySelector('.ctp-col-hours .selected');
      if(selH) selH.scrollIntoView({block:'nearest'});
      const selM = popover.querySelector('.ctp-col-mins .selected');
      if(selM) selM.scrollIntoView({block:'nearest'});
    }, 0);
  }

  function adjustPopoverPosition(){
    popover.style.left = '0';
    popover.style.right = 'auto';
    const rect = popover.getBoundingClientRect();
    if(rect.right > (window.innerWidth || document.documentElement.clientWidth) - 12){
      popover.style.left = 'auto';
      popover.style.right = '0';
    }
  }

  trigger.onclick = e => {
    e.stopPropagation();
    const isOpen = !popover.classList.contains('hidden');
    closeAllCustomDropdowns();
    if(!isOpen){
      const parsed = parseTimeToParts(inp.value);
      tempH12 = parsed.h12;
      tempM = parsed.m;
      tempAmPm = parsed.ampm;
      renderContent();
      popover.classList.remove('hidden');
      trigger.classList.add('open');
      adjustPopoverPosition();
    }
  };

  popover.onclick = e => {
    e.stopPropagation();

    const ampmBtn = e.target.closest('.ctp-ampm-btn');
    if(ampmBtn){
      tempAmPm = ampmBtn.dataset.ampm;
      commitValue(tempH12, tempM, tempAmPm, false);
      return;
    }

    const hBtn = e.target.closest('[data-hour]');
    if(hBtn){
      tempH12 = parseInt(hBtn.dataset.hour, 10);
      commitValue(tempH12, tempM, tempAmPm, false);
      return;
    }

    const mBtn = e.target.closest('[data-min]');
    if(mBtn){
      tempM = mBtn.dataset.min;
      commitValue(tempH12, tempM, tempAmPm, false);
      return;
    }

    const pBtn = e.target.closest('[data-preset]');
    if(pBtn){
      const [hStr, rest] = pBtn.dataset.preset.split(':');
      const [mStr, ampm] = rest.split(' ');
      tempH12 = parseInt(hStr, 10);
      tempM = mStr;
      tempAmPm = ampm;
      commitValue(tempH12, tempM, tempAmPm, true);
      return;
    }

    const clearBtn = e.target.closest('[data-act="clear"]');
    if(clearBtn){
      inp.value = '';
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      inp.dispatchEvent(new Event('change', { bubbles: true }));
      updateTrigger();
      popover.classList.add('hidden');
      trigger.classList.remove('open');
      return;
    }

    const nowBtn = e.target.closest('[data-act="now"]');
    if(nowBtn){
      const now = new Date();
      let nowH = now.getHours();
      let nowM = Math.round(now.getMinutes() / 15) * 15;
      if(nowM >= 60){ nowM = 0; nowH++; }
      const ampm = nowH >= 12 ? 'PM' : 'AM';
      let h12 = nowH % 12;
      if(h12 === 0) h12 = 12;
      tempH12 = h12;
      tempM = String(nowM).padStart(2, '0');
      tempAmPm = ampm;
      commitValue(tempH12, tempM, tempAmPm, true);
      return;
    }

    const doneBtn = e.target.closest('[data-act="done"]');
    if(doneBtn){
      commitValue(tempH12, tempM, tempAmPm, true);
      return;
    }
  };

  inp._syncCustomPicker = updateTrigger;
  updateTrigger();
}

function enhanceAllDatePickers(container = document){
  container.querySelectorAll('input[type="date"]:not([data-enhanced]):not([data-no-enhance])').forEach(enhanceDatePicker);
}

function enhanceAllTimePickers(container = document){
  container.querySelectorAll('input[type="time"]:not([data-enhanced]):not([data-no-enhance])').forEach(enhanceTimePicker);
}

function syncAllCustomPickers(){
  document.querySelectorAll('input[data-enhanced]').forEach(inp => {
    inp._syncCustomPicker?.();
  });
}

/* ============ RENDER ============ */
function mine(){return user.rol==='admin'?citas:citas.filter(c=>nameOf(c.asesorId)===user.nombre||c.asesorId===user.id||nameOf(c.creadoPor)===user.nombre)}
function currentList(){
  const t=iso(new Date());let l=mine();
  const [wStart,wEnd]=getWeekRange(selectedWeekRef), [mStart,mEnd]=getMonthRange(selectedMonthRef);
  if(view==='hoy')l=l.filter(c=>c.fecha===t);
  else if(view==='manana')l=l.filter(c=>c.fecha===addDays(t,1));
  else if(view==='semana')l=l.filter(c=>c.fecha>=wStart&&c.fecha<=wEnd);
  else if(view==='mes')l=l.filter(c=>c.fecha>=mStart&&c.fecha<=mEnd);

  const q=$('#f-q')?$('#f-q').value.toLowerCase().trim():'';
  const d=$('#f-date')?$('#f-date').value:'';
  const dType=$('#f-date-type')?$('#f-date-type').value:'cita';
  const st=$('#f-st')?$('#f-st').value:'';
  const su=$('#f-suc')?$('#f-suc').value:'';
  const tip=$('#f-tip')?$('#f-tip').value:'';
  const ori=$('#f-ori')?$('#f-ori').value:'';
  const as=$('#f-as')?$('#f-as').value:'';
  if(q)l=l.filter(c=>c.paciente.toLowerCase().includes(q)||c.telefono.includes(q));
  if(d){
    if(dType==='registro') l=l.filter(c=>(c.creadoEl||'').slice(0,10)===d);
    else l=l.filter(c=>c.fecha===d);
  }
  if(st)l=l.filter(c=>c.estatus===st);
  if(su)l=l.filter(c=>c.sucursal===su);
  if(tip)l=l.filter(c=>c.tipo===tip);
  if(ori)l=l.filter(c=>c.origen===ori);
  if(as)l=l.filter(c=>nameOf(c.asesorId)===nameOf(as)||c.asesorId===as);

  const sortMode=$('#f-sort')?$('#f-sort').value:'cita_asc';
  return l.sort((a,b)=>{
    if(sortMode==='reg_desc')return(b.creadoEl||'').localeCompare(a.creadoEl||'');
    if(sortMode==='reg_asc')return(a.creadoEl||'').localeCompare(b.creadoEl||'');
    if(sortMode==='cita_desc')return(b.fecha+b.hora).localeCompare(a.fecha+a.hora);
    return(a.fecha+a.hora).localeCompare(b.fecha+b.hora);
  });
}

    attachMonthPicker($('#cmp-wrap-nav'), selectedMonthRef, ym=>{
      selectedMonthRef=ym+'-01';
      render();
    });
    return;
  }

  box.innerHTML='';
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  $('#filters').classList.toggle('hidden',!filtersOpen);
  $('#b-toggle-filters')?.classList.toggle('active',filtersOpen);
  checkFiltersActive();
  updateBadges();
  renderAviso();
  renderPeriodNav();
  const t=iso(new Date());
  const isStd=(weekMode==='std');
  const [wStart,wEnd]=getWeekRange(selectedWeekRef);
  const [mStart,mEnd]=getMonthRange(selectedMonthRef);
  const mName=new Date(selectedMonthRef+'T12:00:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  const isCurrWeek=(wStart===getWeekRange(t)[0]);
  const isCurrMonth=(mStart===getMonthRange(t)[0]);
  const weekLabel=isStd
    ?`Lunes ${fmtShort(wStart)} al Domingo ${fmtShort(wEnd)}`
    :`Jueves ${fmtShort(wStart)} al Miércoles ${fmtShort(wEnd)}`;
  const weekTitle=isStd
    ?(isCurrWeek?'Citas de esta semana (Lun–Dom)':'Citas de la semana (Lun–Dom)')
    :(isCurrWeek?'Citas de esta semana (Jue–Mié)':'Citas de la semana (Jue–Mié)');

  const titles={
    hoy:['Citas de hoy',fmtLong(t)],
    manana:['Citas de mañana',fmtLong(addDays(t,1))],
    semana:[weekTitle,weekLabel],
    mes:[isCurrMonth?'Citas de este mes':'Citas del mes',mName],
    todas:['Todas las citas','Historial completo'],
    presupuestos:['Planes de Tratamiento y Presupuestos','Seguimiento clínico y financiero por Asesor Dental']
  };
  $('#h-title').textContent=titles[view][0];
  $('#h-sub').textContent=titles[view][1];

  if(view === 'presupuestos'){
    const kpis = computeAllBudgetsKpis();
    $('#stats').innerHTML = `
      <div class="card stat"><label>Pacientes con Plan</label><b>${kpis.total}</b></div>
      <div class="card stat"><label>En Tratamiento</label><b class="ok">${kpis.enTratamiento}</b></div>
      <div class="card stat"><label>Pendientes de Inicio</label><b class="warn">${kpis.pendientes}</b></div>
      <div class="card stat"><label>Completados</label><b style="color:var(--brand-teal,#0097a7)">${kpis.completados}</b></div>`;
    renderPresupuestosView();
    return;
  }

  const l=currentList();
  const n=e=>l.filter(c=>c.estatus===e).length;
  const asis=n('Asistió'),no=n('No asistió'),tasa=(asis+no)?Math.round(asis/(asis+no)*100)+'%':'—';
  $('#stats').innerHTML=`
    <div class="card stat"><label>Citas</label><b>${l.length}</b></div>
    <div class="card stat"><label>Asistieron</label><b class="ok">${asis}</b></div>
    <div class="card stat"><label>No asistieron</label><b class="bad">${no}</b></div>
    <div class="card stat"><label>Asistencia</label><b>${tasa}</b></div>`;
  if(!l.length){$('#content').innerHTML='<div class="card empty">No hay citas para mostrar en este periodo.</div>';return}
  const sortByReg=($('#f-sort')&&$('#f-sort').value.startsWith('reg_'));
  let html='',cur=null;
  const rows=[];
  l.forEach(c=>{
    const groupKey=sortByReg?(c.creadoEl?c.creadoEl.slice(0,10):'sin_fecha'):c.fecha;
    const groupLabel=sortByReg?('Registradas el '+fmtLong(groupKey)):fmtLong(groupKey);
    if((view==='todas'||view==='semana'||view==='mes')&&groupKey!==cur){
      if(cur!==null)html+=`<div class="card list">${rows.splice(0).join('')}</div>`;
      cur=groupKey;
      html+=`<div class="day">${esc(groupLabel)}</div>`;
    }
    rows.push(rowHTML(c));
  });
  html+=`<div class="card list">${rows.join('')}</div>`;
  $('#content').innerHTML=html;
  enhanceAllSelects();
  syncAllCustomSelects();
  enhanceAllDatePickers();
  enhanceAllTimePickers();
  syncAllCustomPickers();
}

function renderPresupuestosView(){
  const myPres = getMyBudgets();
  let list = myPres;

  if(budgetFilter === 'en_tratamiento'){
    list = list.filter(b => getBudgetSemáforo(b).status === 'en_tratamiento');
  } else if(budgetFilter === 'pendiente' || budgetFilter === 'solo_valoracion'){
    list = list.filter(b => getBudgetSemáforo(b).status === 'pendiente');
  } else if(budgetFilter === 'completado'){
    list = list.filter(b => getBudgetSemáforo(b).status === 'completado');
  }

  const q = $('#f-q') ? $('#f-q').value.toLowerCase().trim() : '';
  if(q){
    list = list.filter(b => (b.paciente||'').toLowerCase().includes(q) || (b.telefono||'').includes(q) || (b.folio||'').includes(q));
  }

  const as = $('#f-as') ? $('#f-as').value : '';
  if(as){
    list = list.filter(b => nameOf(b.asesorId) === nameOf(as) || b.asesorId === as);
  }

  const cAll = myPres.length;
  const cTrat = myPres.filter(b => getBudgetSemáforo(b).status === 'en_tratamiento').length;
  const cPend = myPres.filter(b => getBudgetSemáforo(b).status === 'pendiente').length;

  let html = `
    <div class="bp-filter-toolbar">

          <span class="bp-dot green"></span> En Tratamiento <span class="bp-count">${cTrat}</span>
        </button>
        <button class="bp-filter-btn warn ${budgetFilter==='pendiente'||budgetFilter==='solo_valoracion'?'active':''}" data-act="filter-presupuesto" data-filter="pendiente" title="Presupuestos emitidos aún sin abono ni fases realizadas">
          <span class="bp-dot yellow"></span> Pendientes <span class="bp-count">${cPend}</span>
        </button>
        <button class="bp-filter-btn info ${budgetFilter==='completado'?'active':''}" data-act="filter-presupuesto" data-filter="completado" title="Presupuestos 100% cubiertos">
          <span class="bp-dot blue"></span> Completados <span class="bp-count">${cComp}</span>
        </button>
      </div>

  `;

        <div style="margin-bottom:12px;color:var(--text-light);display:flex;justify-content:center">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

function rowHTML(c){
  const t=iso(new Date());
  let wa='';
  if(c.telefono&&c.estatus==='Pendiente'){
    const cleanTel=c.telefono.replace(/\D/g,'');
    let msg='';
    if(c.fecha===addDays(t,1)){
      msg=`Hola ${c.paciente.split(' ')[0]}, te confirmamos tu cita en Dental Más Fácil mañana a las ${c.hora}. ¿Nos confirmas tu asistencia?`;
    }else if(c.fecha===t){
      msg=`Hola ${c.paciente.split(' ')[0]}, te recordamos tu cita de hoy en Dental Más Fácil a las ${c.hora}. ¡Te esperamos!`;
    }else{
      msg=`Hola ${c.paciente.split(' ')[0]}, te saludamos de Dental Más Fácil para confirmar tu cita del ${fmtShort(c.fecha)} a las ${c.hora}. ¿Nos confirmas tu asistencia?`;
    }
    wa=` · <a class="wa-link" href="https://wa.me/52${cleanTel}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Confirmar WhatsApp</a>`;
  }
  const regTxt=c.creadoEl?fmtReg(c.creadoEl):'';
  const creator=c.creadoPor?nameOf(c.creadoPor):'';
  const regHtml=regTxt?`
      <div class="reg-meta" title="Fecha y hora de registro: ${esc(regTxt)}${creator?' · Por: '+esc(creator):''}">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Alta: <b>${esc(regTxt)}</b></span>
        ${creator?`<span class="reg-sep">·</span><span>por <b>${esc(creator)}</b></span>`:''}
      </div>`:'';

  const pKey = patientKey(c.telefono, c.paciente);
  const b = presupuestos[pKey];
  const pCitas = getPatientCitas(c.telefono, c.paciente);
  const vIdx = pCitas.findIndex(x => x.id === c.id);
  const vNum = vIdx >= 0 ? vIdx + 1 : 1;
  const visitText = vNum > 1 ? `Cita #${vNum}` : (c.tipo || 'Nueva');

  let budgetHtml = '';
  if(b){
    const totals = computeBudgetTotals(b);
    const sem = getBudgetSemáforo(b);
    budgetHtml = `
      <div class="row-budget-pill ${sem.badgeClass}" data-act="budget" data-id="${c.id}" data-key="${esc(pKey)}" title="Presupuesto #${esc(b.folio)}: Pagado ${fmtMoney(totals.totalPagado)} de ${fmtMoney(b.total)}. Clic para ver plan completo.">
        ${sem.icon}
        <span><b>Presupuesto #${esc(b.folio || 'S/N')}</b>: ${fmtMoney(totals.totalPagado)} / ${fmtMoney(b.total)} (${totals.progreso}%)</span>
        <div class="bp-mini-bar"><div class="bp-mini-fill" style="width:${totals.progreso}%"></div></div>
      </div>`;
  }

  const whatParts = [];
  if(c.sucursal) whatParts.push(`<span class="what-branch">${esc(c.sucursal)}</span>`);
  if(c.paquete && c.paquete !== 'Individual') whatParts.push(`<span class="reg-meta" style="color:#0ea5e9!important;border-color:rgba(14,165,233,.3);background:rgba(14,165,233,.08);padding:1px 6px"><b>${esc(c.paquete)}</b></span>`);
  if(visitText) whatParts.push(`<span class="what-type">${esc(visitText)}</span>`);
  const asesorName = c.asesorId ? nameOf(c.asesorId) : '';
  if(asesorName) whatParts.push(`<span class="what-advisor">Asesor: <b>${esc(asesorName)}</b></span>`);
  const whatMetaHtml = whatParts.join('<span class="what-sep">·</span>');
  const fullMetaTitle = [c.sucursal, visitText, asesorName ? `Asesor: ${asesorName}` : ''].filter(Boolean).join(' · ');

  return `<div class="row">
    <div class="time">
      <div class="row-hora">${esc(c.hora)}</div>
      <div class="row-cita-badge" title="Fecha en que el paciente tiene su cita">Cita: ${esc(fmtShort(c.fecha))}</div>
    </div>
    <div class="who">
      <b title="${esc(c.paciente)}">${esc(c.paciente)}</b>
      <span class="m">${esc(c.telefono)}${wa}</span>
      ${regHtml}
      ${budgetHtml}
    </div>
    <div class="what">
      <b class="what-title" title="${esc(c.tratamiento)}">${esc(c.tratamiento)}</b>
      <div class="what-meta" title="${esc(fullMetaTitle)}">${whatMetaHtml}</div>
    </div>
    <div class="st">
      <span class="pill ${pillCls(c.estatus)}">${esc(c.estatus)}</span>
      ${c.motivo?`<span class="m" style="margin-top:4px">${esc(c.motivo)}</span>`:''}
    </div>
    <div class="act">
      <button class="btn out sm" data-act="status" data-id="${c.id}">Estatus</button>
      <button class="btn out sm" data-act="edit" data-id="${c.id}">Editar</button>
    </div>
  </div>`;
}

async function saveCita(id){
  const v=k=>$('#'+k).value.trim();
  const d={paciente:v('c-pac'),telefono:v('c-tel'),sucursal:v('c-suc'),fecha:v('c-fec'),hora:v('c-hor'),tratamiento:v('c-tra'),paquete:$('#c-paq')?$('#c-paq').value:'Individual',tipo:v('c-tip'),origen:v('c-ori'),notas:v('c-not')};
  if(!d.paciente||!d.telefono||!d.sucursal||!d.fecha||!d.hora||!d.tratamiento){$('#c-err').textContent='Completa paciente, teléfono, sucursal, fecha, hora y tratamiento.';return}
  const asesorNombre=($('#c-as')&&$('#c-as').value)?$('#c-as').value.trim():(user?user.nombre:'Miguel');
  const creadorNombre=user?user.nombre:asesorNombre;
  const now=new Date().toISOString();
  let target=null;
  if(id){
    target=citas.find(c=>c.id===id);
    if(target){
      Object.assign(target,d,{asesorId:asesorNombre});
      if(!target.creadoEl) target.creadoEl=now;
      if(!target.creadoPor) target.creadoPor=creadorNombre;
    }
  } else {
    target={id:uid(),...d,asesorId:asesorNombre,creadoEl:now,creadoPor:creadorNombre,estatus:'Pendiente',motivo:'',historial:[{f:now,e:'Pendiente'}]};
    citas.push(target);
  }
  persist();closeModal();render();
  if(target) await DB.upsert(target);
}

async function saveStatus(id){
  const c=citas.find(x=>x.id===id),mot=$('#s-mot')?$('#s-mot').value.trim():'';
  const now=new Date().toISOString();
  let nuevaCita=null;
  if(stSel==='Reagendó'){
    const f=$('#s-fec').value,h=$('#s-hor').value;
    if(!f||!h){$('#s-err').textContent='Indica la nueva fecha y hora.';return}
    if(c.estatus!=='Reagendó'){
      nuevaCita={...c,id:uid(),fecha:f,hora:h,tipo:'Reagenda',estatus:'Pendiente',motivo:'',notas:(c.notas?c.notas+' · ':'')+'Reagendada desde '+fmtShort(c.fecha)+' '+c.hora,creadoEl:now,creadoPor:user?user.nombre:nameOf(c.asesorId),asesorId:nameOf(c.asesorId),historial:[{f:now,e:'Pendiente'}]};
      citas.push(nuevaCita);
    }
  }

  // Si marcó Asistió y capturó abono:
  if(stSel==='Asistió' && $('#s-abono-monto')){
    const abMonto = parseFloat($('#s-abono-monto').value) || 0;
    if(abMonto > 0){
      const pKey = patientKey(c.telefono, c.paciente);
      let b = presupuestos[pKey];
      const abConcepto = $('#s-abono-concepto')?.value.trim() || 'Abono en consulta';
      const abAsesor = user ? user.nombre : nameOf(c.asesorId);

      if(!b){
        b = {
          id: 'pres_' + uid(),
          telefono: c.telefono || '',
          paciente: c.paciente || '',
          asesorId: nameOf(c.asesorId),
          folio: '',
          total: abMonto,
          abonoInicial: 0,
          saldo: 0,
          fechaEmision: iso(new Date()),
          pasos: [],
          abonos: [],
          actualizadoEl: now
        };
      }
      if(!Array.isArray(b.abonos)) b.abonos = [];
      b.abonos.push({
        id: 'ab_' + uid(),
        fecha: now,
        monto: abMonto,
        concepto: abConcepto,
        asesor: abAsesor,
        citaId: c.id
      });
      const totals = computeBudgetTotals(b);
      b.saldo = totals.saldo;
      b.actualizadoEl = now;
      presupuestos[pKey] = b;
      savePresupuestosLocal();

      if(!Array.isArray(c.historial)) c.historial = [];
      c.historial.push({
        f: now,
        e: `Abono de ${fmtMoney(abMonto)} (${abConcepto})`,
        tipo: 'presupuesto_sync',
        data: b
      });
    }
  }

  // Si antes tenía Asistió y ahora cambia a otro estatus (ej. No asistió, Canceló, Reagendó, Pendiente):
  if(c.estatus==='Asistió' && stSel!=='Asistió'){
    const sheetsId = c.sheetsId || ('dmf_' + c.id);
    enviarAsistenciaASheets({
      accion: 'eliminar',
      id: sheetsId
    });
    c.sheetsAsistenciaEnviada = false;
    c.sheetsId = null;
  }

  // Si marcó Asistió y está activo el envío a Google Sheets:
  if(stSel==='Asistió'){
    const paq = c.paquete || 'Individual';
    const aNombre = nameOf(c.asesorId);
    const cSucursal = mapClinicaSheets(c.sucursal);
    const cOrigen = mapOrigenSheets(c.origen, aNombre);
    const sheetsId = c.sheetsId || ('dmf_' + c.id);
    const sheetsPayload = {
      id: sheetsId,
      fecha: c.fecha,
      nombre: c.paciente,
      clinica: cSucursal,
      asesor: (aNombre && aNombre !== '—') ? aNombre : 'Sin asignar',
      paquete: paq,
      origen: cOrigen
    };

    c.sheetsAsistenciaEnviada = true;
    c.sheetsId = sheetsId;
    c.paquete = paq;

    enviarAsistenciaASheets(sheetsPayload);
  }

  c.estatus=stSel;c.motivo=(stSel==='Asistió'||stSel==='Pendiente'||stSel==='Confirmada'||stSel==='Confirmó'||stSel==='Confirma')?'':mot;
  c.historial=(c.historial||[]).concat({f:now,e:stSel});
  persist();closeModal();render();
  await DB.upsert(c);
  if(nuevaCita) await DB.upsert(nuevaCita);
}

function renderModalPasos(){
  const listEl = $('#bp-pasos-list');
  if(!listEl) return;
  if(!currentModalPasos.length){
    listEl.innerHTML = `
      <div style="font-size:12px;color:var(--text-muted);padding:14px;text-align:center;background:var(--bg-color);border:1px dashed var(--border-dark);border-radius:var(--radius-md)">
        No se han detectado fases clínicas todavía. Adjunta el PDF de Dentalink arriba para extraerlas automáticamente o haz clic en <b>+ Agregar Paso manual</b>.
      </div>`;
    return;
  }
  listEl.innerHTML = currentModalPasos.map((p, idx) => `
    <div class="bp-paso-card ${p.completado ? 'is-completed' : ''}">
      <label class="bp-paso-check-label" title="${p.completado ? 'Fase realizada (clic para desmarcar)' : 'Clic para marcar como Realizada y registrar abono'}">
        <input type="checkbox" class="bp-paso-checkbox" ${p.completado ? 'checked' : ''} onchange="togglePasoCompletado(${idx}, this.checked)">
        <span class="bp-paso-custom-check">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
      </label>
      <div class="bp-paso-info">
        <div class="bp-paso-title">${esc(p.descripcion)}</div>
        ${p.piezas && p.piezas !== '-' ? `<div class="bp-paso-sub">Piezas: <b>${esc(p.piezas)}</b></div>` : ''}
      </div>
      <div class="bp-paso-amount">
        <b>${fmtMoney(p.monto)}</b>
        <span class="bp-paso-badge ${p.completado ? 'ok' : 'pend'}">${p.completado ? 'Realizada' : 'Pendiente'}</span>
      </div>
      <button type="button" class="btn-text-sm" style="color:var(--bad);padding:4px 6px;margin-left:4px" title="Eliminar fase" onclick="deleteModalPaso(${idx})">✕</button>
    </div>
  `).join('');
}

function deleteModalPaso(idx){
  const paso = currentModalPasos[idx];
  if(!paso) return;
  const pasoKey = 'paso_' + (paso.numero || (idx + 1));
  currentModalAbonos = (currentModalAbonos || []).filter(a => a.pasoKey !== pasoKey);
  currentModalPasos.splice(idx, 1);
  renderModalPasos();
  renderModalAbonos();
  recalculateModalBudget();
}

function togglePasoCompletado(idx, isChecked){
  const paso = currentModalPasos[idx];
  if(!paso) return;
  paso.completado = isChecked;
  paso.estado = isChecked ? 'Realizada' : 'Pendiente';

  const pasoKey = 'paso_' + (paso.numero || (idx + 1));

  if(isChecked){
    // Registrar abono vinculado a esta fase si no existe
    const existingAbono = (currentModalAbonos || []).find(a => a.pasoKey === pasoKey);
    if(!existingAbono && paso.monto > 0){
      currentModalAbonos.push({
        id: 'ab_' + uid(),
        fecha: new Date().toISOString(),
        monto: paso.monto,
        concepto: `${paso.descripcion}`,
        asesor: user ? user.nombre : 'Miguel',
        pasoKey: pasoKey
      });
    }
  } else {
    // Si se desmarca, remover el abono automático vinculado a este paso
    currentModalAbonos = (currentModalAbonos || []).filter(a => a.pasoKey !== pasoKey);
  }

  renderModalPasos();
  renderModalAbonos();
  recalculateModalBudget();
}

function renderModalAbonos(){
  const tableEl = $('#bp-abonos-table');
  if(!tableEl) return;
  if(!currentModalAbonos.length){
    tableEl.innerHTML = `<div style="padding:12px;font-size:12px;color:var(--text-light);text-align:center">No hay abonos registrados para este paciente</div>`;
    return;
  }
  tableEl.innerHTML = currentModalAbonos.map((a, idx) => `
    <div class="bp-abono-row">
      <div>
        <b>${fmtMoney(a.monto)}</b>
        <span style="color:var(--text-muted);margin-left:6px">${esc(a.concepto || 'Abono')}</span>
      </div>
      <div style="font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:8px">
        <span>${fmtShort(a.fecha ? a.fecha.slice(0,10) : iso(new Date()))} · Asesor: <b>${esc(a.asesor || 'Asesor')}</b></span>
        <button type="button" class="btn-text-sm" style="color:var(--bad);padding:0 4px" onclick="currentModalAbonos.splice(${idx},1);renderModalAbonos();recalculateModalBudget()">✕</button>
      </div>
    </div>
  `).join('');
}

function recalculateModalBudget(){
  const total = parseFloat($('#bp-total')?.value) || 0;
  const abonoIni = parseFloat($('#bp-abono-inicial')?.value) || 0;
  const sumAbonos = (currentModalAbonos || []).reduce((acc,a)=>acc+(parseFloat(a.monto)||0), 0);
  const totalPagado = abonoIni + sumAbonos;
  const saldo = Math.max(0, total - totalPagado);
  const pct = (total > 0) ? Math.min(100, Math.round((totalPagado / total) * 1000) / 10) : 0;

  if($('#bp-saldo')) $('#bp-saldo').value = saldo.toFixed(2);
  if($('#bp-progreso-txt')) $('#bp-progreso-txt').textContent = `${pct}% cubierto (${fmtMoney(totalPagado)} de ${fmtMoney(total)})`;
  if($('#bp-progreso-bar')) $('#bp-progreso-bar').style.width = `${pct}%`;
}

async function handleBudgetPDF(file){
  const statusEl = $('#budget-pdf-status');
  if(!statusEl) return;
  statusEl.classList.remove('hidden');
  statusEl.className = 'pdf-status-msg busy';
  statusEl.innerHTML = '<span class="pdf-spinner"></span> Leyendo datos de Dentalink con pdf.js...';

  try {
    const data = await parseDentalinkPDFFile(file);

    if(data.folio && $('#bp-folio')) $('#bp-folio').value = data.folio;
    if(data.paciente && $('#bp-pac') && !$('#bp-pac').value) $('#bp-pac').value = data.paciente;
    if(data.total > 0 && $('#bp-total')) $('#bp-total').value = data.total;

    currentModalPasos = data.pasos || [];
    currentModalAbonos = (currentModalAbonos || []).filter(a => a.id !== 'ab_ini' && a.concepto !== 'Cita de Valoración inicial');

    // Si el PDF de Dentalink ya traía fases como "Realizada", agregarlas automáticamente al historial de abonos
    let sumRealized = 0;
    currentModalPasos.forEach((p, idx) => {
      const pasoKey = 'paso_' + (p.numero || (idx + 1));
      if(p.completado && p.monto > 0){
        sumRealized += p.monto;
        const hasAbono = (currentModalAbonos || []).some(a => a.pasoKey === pasoKey);
        if(!hasAbono){
          currentModalAbonos.push({
            id: 'ab_' + uid(),
            fecha: new Date().toISOString(),
            monto: p.monto,
            concepto: `${p.descripcion}`,
            asesor: user ? user.nombre : 'Miguel',
            pasoKey: pasoKey
          });
        }
      }
    });

    const remainingAbono = Math.max(0, data.abono - sumRealized);
    if($('#bp-abono-inicial')) $('#bp-abono-inicial').value = remainingAbono;
    if($('#bp-saldo')) $('#bp-saldo').value = data.saldo >= 0 ? data.saldo : Math.max(0, data.total - data.abono);

    renderModalPasos();
    renderModalAbonos();
    recalculateModalBudget();

    statusEl.className = 'pdf-status-msg ok';
    statusEl.innerHTML = `✓ <b>Presupuesto #${esc(data.folio || '')} extraído con éxito</b> · Total: ${fmtMoney(data.total)} · Abonos: ${fmtMoney(data.abono)} · Saldo: ${fmtMoney(data.saldo)} · ${currentModalPasos.length} fases clínicas detectadas`;
  } catch(err) {
    console.error('Error parseando PDF Dentalink:', err);
    statusEl.className = 'pdf-status-msg err';
    statusEl.innerHTML = `No se pudo extraer el texto automáticamente (${esc(err.message)}). Puedes capturar los montos manualmente abajo.`;
  }
}

async function saveBudget(budgetId, citaId){
  const folio = $('#bp-folio')?.value.trim();
  const total = parseFloat($('#bp-total')?.value) || 0;
  const abonoIni = parseFloat($('#bp-abono-inicial')?.value) || 0;
  const pac = $('#bp-pac') ? $('#bp-pac').value.trim() : '';
  const tel = $('#bp-tel') ? $('#bp-tel').value.trim() : '';
  const as = $('#bp-as') ? $('#bp-as').value.trim() : (user ? user.nombre : 'Miguel');
  const notas = $('#bp-notas')?.value.trim() || '';
  const fecha = iso(new Date());

  if(!folio && total <= 0){
    $('#bp-err').textContent = 'Por favor ingresa al menos el folio o el total del presupuesto.';
    return;
  }

  const key = patientKey(tel, pac);
  if(!key){
    $('#bp-err').textContent = 'Falta el nombre o teléfono del paciente.';
    return;
  }

  const existing = presupuestos[key] || {};
  const sumAbonos = (currentModalAbonos || []).reduce((acc, a) => acc + (parseFloat(a.monto) || 0), 0);
  const totalPagado = abonoIni + sumAbonos;
  const saldo = Math.max(0, total - totalPagado);

  const budgetObj = {
    ...existing,
    id: budgetId || existing.id || ('pres_' + uid()),
    folio: folio || existing.folio || '',
    telefono: tel || existing.telefono || '',
    paciente: pac || existing.paciente || '',
    asesorId: as || existing.asesorId || (user ? user.nombre : 'Miguel'),
    total: total,
    abonoInicial: abonoIni,
    saldo: saldo,
    fechaEmision: existing.fechaEmision || fecha,
    pasos: currentModalPasos || existing.pasos || [],
    abonos: currentModalAbonos || existing.abonos || [],
    notas: notas,
    actualizadoEl: new Date().toISOString()
  };

  presupuestos[key] = budgetObj;
  savePresupuestosLocal();

  let targetCita = citaId ? citas.find(c => c.id === citaId) : null;
  if(!targetCita){
    targetCita = citas.find(c => patientKey(c.telefono, c.paciente) === key);
  }

  closeModal();
  render();

  if(targetCita){
    if(!Array.isArray(targetCita.historial)) targetCita.historial = [];
    const syncIdx = targetCita.historial.findIndex(h => h && h.tipo === 'presupuesto_sync');
    const syncItem = { f: budgetObj.actualizadoEl, e: 'Presupuesto #' + budgetObj.folio, tipo: 'presupuesto_sync', data: budgetObj };
    if(syncIdx >= 0) targetCita.historial[syncIdx] = syncItem;
    else targetCita.historial.push(syncItem);
    persist();
    await DB.upsert(targetCita);
  }
}

async function deleteBudget(budgetId){
  if(!confirm('¿Deseas eliminar este presupuesto y su historial de abonos permanentemente?')) return;
  const entry = Object.entries(presupuestos).find(([k, b]) => b.id === budgetId);
  if(entry){
    const [key, b] = entry;
    delete presupuestos[key];
    savePresupuestosLocal();
    const targetCitas = citas.filter(c => patientKey(c.telefono, c.paciente) === key);
    targetCitas.forEach(c => {
      if(Array.isArray(c.historial)){
        c.historial = c.historial.filter(h => h?.tipo !== 'presupuesto_sync');
        DB.upsert(c);
      }
    });
  }
  closeModal();
  render();
}

/* ============ REPORTES PDF ============ */
const fmtDateYY=s=>{if(!s)return'—';const p=s.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(-2)}`:s};
const fmtDateLongEs=s=>{if(!s)return'—';const d=new Date(s+'T12:00:00');return isNaN(d.getTime())?s:d.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})};
const fmtOrigenShort=o=>{if(!o)return'';if(o.includes('Externa'))return'Externo';if(o.includes('Interna'))return'Interno';if(o.includes('Convenio'))return'Convenio';return o};

  type:'atendidos',

  weekMode:'dmf',
  weekRef:iso(new Date()),
  monthRef:iso(new Date()).slice(0,7),

};

function getRepTypeHelpText(){

  } else if(repConfig.type==='citas'){
    return 'Muestra el control de <u>todas las citas agendadas</u> en el período (pendientes, asistió, no asistió, reagendadas, canceladas).';
  } else {
    return 'Consolida el número de <u>citas agendadas</u> vs <u>pacientes que asistieron</u> con métricas y desglose por asesor.';
  }
}

function getReportDateRange(){
  let s='',e='',title='',sub='';
  if(repConfig.period==='semana'){
    const isStd=(repConfig.weekMode==='std');
    const [wS,wE]=isStd?getStdWeekRange(repConfig.weekRef):getDmfWeekRange(repConfig.weekRef);
    s=wS;e=wE;
    title=isStd
      ?`Semana Normal (Lunes a Domingo) · Del ${fmtDateLongEs(s)} al ${fmtDateLongEs(e)}`
      :`Semana DMF (Jueves a Miércoles) · Del ${fmtDateLongEs(s)} al ${fmtDateLongEs(e)}`;
    sub=`Semana del ${fmtShort(s)} al ${fmtShort(e)} (${isStd?'Lun–Dom':'Jue–Mié'})`;
  } else if(repConfig.period==='quincena'){
    const ym=repConfig.fortnightMonth||iso(new Date()).slice(0,7);
    const [yStr,mStr]=ym.split('-');
    const y=parseInt(yStr,10),m=parseInt(mStr,10);
    const lastDay=new Date(y,m,0).getDate();
    const mDate=new Date(y,m-1,1);
    const mName=mDate.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
    const mSolo=mDate.toLocaleDateString('es-MX',{month:'long'});
    if(repConfig.fortnightPart==='1'){
      s=`${ym}-01`;e=`${ym}-15`;
      title=`1ra Quincena de ${mName} · Del 1 al 15 de ${mSolo} de ${y}`;
      sub=`1ra Quincena (01 al 15 de ${mSolo})`;
    } else if(repConfig.fortnightPart==='2'){
      s=`${ym}-16`;e=`${ym}-${String(lastDay).padStart(2,'0')}`;
      title=`2da Quincena de ${mName} · Del 16 al ${lastDay} de ${mSolo} de ${y}`;
      sub=`2da Quincena (16 al ${lastDay} de ${mSolo})`;
    } else {
      s=`${ym}-01`;e=`${ym}-${String(lastDay).padStart(2,'0')}`;
      title=`Quincenas completas de ${mName} · Del 1 al ${lastDay} de ${mSolo} de ${y}`;
      sub=`Mes completo de ${mSolo} ${y}`;
    }
  } else if(repConfig.period==='mes'){
    const ym=repConfig.monthRef||iso(new Date()).slice(0,7);
    const [yStr,mStr]=ym.split('-');
    const y=parseInt(yStr,10),m=parseInt(mStr,10);
    const lastDay=new Date(y,m,0).getDate();
    const mName=new Date(y,m-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});
    s=`${ym}-01`;e=`${ym}-${String(lastDay).padStart(2,'0')}`;
    title=`Mes de ${mName} · Del 1 al ${lastDay} de ${mName}`;
    sub=`Mes de ${mName}`;
  } else {
    s=repConfig.dateFrom||iso(new Date());
    e=repConfig.dateTo||s;
    if(s>e){const tmp=s;s=e;e=tmp}
    title=`Período personalizado · Del ${fmtDateLongEs(s)} al ${fmtDateLongEs(e)}`;
    sub=`Del ${fmtShort(s)} al ${fmtShort(e)}`;
  }
  return {startDate:s,endDate:e,periodTitle:title,periodSub:sub};
}

function getReportFilename(){
  let typeTag='Pacientes_Atendidos';
  if(repConfig.type==='citas') typeTag='Control_Citas';
  else if(repConfig.type==='ejecutivo') typeTag='Reporte_Ejecutivo';
  const asesorTag=repConfig.asesor==='todos'?'Todos_Asesores':(nameOf(repConfig.asesor).replace(/\s+/g,'_')||'Asesor');
  const basisTag=repConfig.dateBasis==='registro'?'Por_Registro':'Por_Cita';
  let periodTag='';
  if(repConfig.period==='semana'){
    const isStd=(repConfig.weekMode==='std');
    const [wStart,wEnd]=isStd?getStdWeekRange(repConfig.weekRef):getDmfWeekRange(repConfig.weekRef);
    const mode=isStd?'Normal':'DMF';
    periodTag=`Semana_${mode}_${wStart}_al_${wEnd}`;
  } else if(repConfig.period==='quincena'){
    const qPart=repConfig.fortnightPart==='1'?'1ra_Qna':(repConfig.fortnightPart==='2'?'2da_Qna':'Mes_Qnas');
    periodTag=`${qPart}_${repConfig.fortnightMonth}`;
  } else if(repConfig.period==='mes'){
    periodTag=`Mes_${repConfig.monthRef}`;
  } else {
    periodTag=`Rango_${repConfig.dateFrom}_al_${repConfig.dateTo}`;
  }
  return `DentalFacil_${typeTag}_${periodTag}_${basisTag}_${asesorTag}.pdf`;
}

function updateReportSuboptions(){
  const box=$('#rep-suboptions-box');
  if(!box)return;
  const today=iso(new Date());

  if(repConfig.period==='semana'){
    const isStd=(repConfig.weekMode==='std');
    const [wStart]=isStd?getStdWeekRange(repConfig.weekRef):getDmfWeekRange(repConfig.weekRef);
    const [currStart]=isStd?getStdWeekRange(today):getDmfWeekRange(today);

    let optsHtml='';
    for(let i=-8;i<=6;i++){
      const ref=addDays(currStart,i*7);
      const [sS,sE]=isStd?getStdWeekRange(ref):getDmfWeekRange(ref);
      const isSel=(sS===wStart);
      const isCurr=(sS===currStart);
      const label=formatWeekOption(sS,sE,isStd,isCurr);
      optsHtml+=`<option value="${sS}" ${isSel?'selected':''}>${label}</option>`;
    }

    box.innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div>
          <span style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-right:8px">Formato:</span>
          <div class="seg seg-sm" id="seg-rep-week-mode" style="display:inline-flex">
            <button class="${!isStd?'on':''}" data-mode="dmf">Semana DMF (Jue–Mié)</button>
            <button class="${isStd?'on':''}" data-mode="std">Semana Normal (Lun–Dom)</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <label style="font-size:12px;font-weight:600;color:var(--text-muted)">Semana:</label>
          <select class="inp sm" id="rep-week-dropdown" style="width:auto;min-width:240px">${optsHtml}</select>
        </div>
      </div>
    `;

    $('#seg-rep-week-mode').onclick=e=>{
      const b=e.target.closest('button[data-mode]');
      if(!b)return;
      repConfig.weekMode=b.dataset.mode;
      updateReportSuboptions();
      renderPdfPreview();
    };
    $('#rep-week-dropdown').onchange=e=>{
      repConfig.weekRef=e.target.value;
      renderPdfPreview();
    };
    enhanceAllSelects(box);
    return;
  }

  if(repConfig.period==='quincena'){
    const qPart=repConfig.fortnightPart;
    const mLabel=formatMonthTitle(repConfig.fortnightMonth);
    box.innerHTML=`
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">

          <label style="font-size:12px;font-weight:600;color:var(--text-muted)">Mes:</label>

              <span>${mLabel}</span>
              <svg class="cmp-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="cmp-popover hidden" id="cmp-popover-quin"></div>
          </div>
        </div>
        <div>
          <span style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-right:8px">Quincena:</span>
          <div class="seg seg-sm" id="seg-rep-quin-part" style="display:inline-flex">

    $('#seg-rep-quin-part').onclick=e=>{

      if(!b)return;
      repConfig.fortnightPart=b.dataset.part;
      updateReportSuboptions();
      renderPdfPreview();
    };
    return;
  }

  if(repConfig.period==='mes'){
    const mLabel=formatMonthTitle(repConfig.monthRef);
    box.innerHTML=`
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <label style="font-size:12px;font-weight:600;color:var(--text-muted)">Mes a reportar:</label>
        <div class="cmp-wrap" id="cmp-wrap-mes">
          <button type="button" class="cmp-trigger inp sm" id="cmp-btn-mes" title="Seleccionar mes">
            <svg class="cmp-trigger-cal" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="18" y2="10"/></svg>
            <span>${mLabel}</span>
            <svg class="cmp-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="cmp-popover hidden" id="cmp-popover-mes"></div>
        </div>
        <button class="btn out sm" id="b-rep-mes-curr">Mes actual</button>
        <button class="btn out sm" id="b-rep-mes-prev">Mes anterior</button>

    attachMonthPicker($('#cmp-wrap-mes'), repConfig.monthRef, ym=>{
      repConfig.monthRef=ym;
      updateReportSuboptions();
      renderPdfPreview();
    });
    $('#b-rep-mes-curr').onclick=()=>{
      repConfig.monthRef=iso(new Date()).slice(0,7);
      updateReportSuboptions();
      renderPdfPreview();
    };
    $('#b-rep-mes-prev').onclick=()=>{
      repConfig.monthRef=addMonths(repConfig.monthRef+'-01',-1).slice(0,7);
      updateReportSuboptions();
      renderPdfPreview();
    };
    return;
  }

  if(repConfig.period==='rango'){
    box.innerHTML=`
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px">
          <label style="font-size:12px;font-weight:600;color:var(--text-muted)">Desde:</label>
          <input type="date" class="inp sm" id="rep-rango-desde" value="${repConfig.dateFrom}" style="width:auto">
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <label style="font-size:12px;font-weight:600;color:var(--text-muted)">Hasta:</label>
          <input type="date" class="inp sm" id="rep-rango-hasta" value="${repConfig.dateTo}" style="width:auto">
        </div>
      </div>
    `;

    enhanceAllDatePickers(box);

    $('#rep-rango-desde').onchange=e=>{
      repConfig.dateFrom=e.target.value;
      renderPdfPreview();
    };
    $('#rep-rango-hasta').onchange=e=>{
      repConfig.dateTo=e.target.value;
      renderPdfPreview();
    };
  }
}

function bindReportModalEvents(){
  const segType=$('#seg-rep-type');
  if(segType){
    segType.onclick=e=>{
      const b=e.target.closest('button[data-type]');
      if(!b)return;
      repConfig.type=b.dataset.type;
      segType.querySelectorAll('button').forEach(btn=>btn.classList.toggle('on',btn.dataset.type===repConfig.type));
      const helpBox=$('#rep-type-help');
      if(helpBox) helpBox.innerHTML=getRepTypeHelpText();
      renderPdfPreview();
    };
  }

  const asesorSel=$('#rep-asesor-sel');
  if(asesorSel){
    asesorSel.onchange=e=>{
      repConfig.asesor=e.target.value;
      renderPdfPreview();
    };
  }

  const segPeriod=$('#seg-rep-period');
  if(segPeriod){
    segPeriod.onclick=e=>{
      const b=e.target.closest('button[data-p]');
      if(!b)return;
      repConfig.period=b.dataset.p;
      segPeriod.querySelectorAll('button').forEach(btn=>btn.classList.toggle('on',btn.dataset.p===repConfig.period));
      updateReportSuboptions();
      renderPdfPreview();
    };
  }

  const segBasis=$('#seg-rep-date-basis');
  if(segBasis){
    segBasis.onclick=e=>{
      const b=e.target.closest('button[data-basis]');
      if(!b)return;
      repConfig.dateBasis=b.dataset.basis;
      segBasis.querySelectorAll('button').forEach(btn=>btn.classList.toggle('on',btn.dataset.basis===repConfig.dateBasis));
      renderPdfPreview();
    };
  }

  const btnDl=$('#b-pdf-download');
  if(btnDl) btnDl.onclick=downloadReportPDF;

  const btnPr=$('#b-pdf-print');
  if(btnPr) btnPr.onclick=printReport;
}

function citaMatchesAsesor(c, asesorVal){
  if(!asesorVal || asesorVal === 'todos') return true;
  const u = USUARIOS.find(x => x.id === asesorVal || x.nombre.toLowerCase() === String(asesorVal).toLowerCase());
  const targetName = u ? u.nombre.toLowerCase() : String(asesorVal).toLowerCase();
  const targetId = u ? u.id.toLowerCase() : '';

  const cAsesor = String(c.asesorId || '').toLowerCase();
  const cAsesorName = nameOf(c.asesorId).toLowerCase();
  const cCreador = nameOf(c.creadoPor || '').toLowerCase();

  return (targetId && cAsesor === targetId) ||
         cAsesor === targetName ||
         cAsesorName === targetName ||
         cCreador === targetName;
}

function renderPdfPreview(){
  const box=$('#pdf-printable-area');
  if(!box)return;

  const {startDate,endDate,periodTitle,periodSub}=getReportDateRange();
  const logoSrc=document.querySelector('.brand img')?.src||'';
  const now=new Date();
  const generatedStr=fmtDateLongEs(iso(now));

  const asesorName=repConfig.asesor==='todos'?'Todos los Asesores':nameOf(repConfig.asesor);
  const basisIsReg=(repConfig.dateBasis==='registro');
  const basisLabel=basisIsReg?'Filtrado por Fecha de Registro':'Filtrado por Fecha de Cita';

  let list=citas.filter(c=>{
    const dVal=basisIsReg?(c.creadoEl||'').slice(0,10):c.fecha;
    return dVal>=startDate&&dVal<=endDate;
  });
  if(repConfig.asesor!=='todos'){
    list=list.filter(c=>citaMatchesAsesor(c, repConfig.asesor));
  }

  if(repConfig.type==='atendidos'){
    // Estricto: son pacientes SOLO cuando asistieron a su cita
    list=list.filter(c=>c.estatus==='Asistió');
    list.sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));

    let rowsHtml='';
    if(!list.length){
      rowsHtml=`<tr><td colspan="5" style="text-align:center;padding:36px;color:#94a3b8;font-style:italic">No hay pacientes atendidos registrados en este período.</td></tr>`;
    } else {
      rowsHtml=list.map(c=>`
        <tr>
          <td class="col-paciente">${esc(c.paciente)}</td>
          <td style="text-align:center;white-space:nowrap">${esc(fmtDateYY(c.fecha))}</td>
          <td style="text-align:center">${esc(c.sucursal)}</td>
          <td style="text-align:center">${esc(nameOf(c.asesorId))}</td>
          <td class="col-origen" style="text-align:right">${esc(fmtOrigenShort(c.origen))}</td>
        </tr>
      `).join('');
    }

    box.innerHTML=`
      <div class="dmf-pdf-document">
        <div class="pdf-header">
          ${logoSrc?`<img src="${logoSrc}" class="pdf-logo" alt="Dental Fácil">`:''}
          <div class="pdf-title">REPORTE DE PACIENTES ATENDIDOS</div>
          <div class="pdf-divider"></div>
          <div class="pdf-meta-date">${esc(startDate===endDate?fmtDateLongEs(startDate):`Del ${fmtDateLongEs(startDate)} al ${fmtDateLongEs(endDate)}`)}</div>
          <div class="pdf-meta-sub">${esc(periodSub)} · ${basisLabel} · Asesor: <b>${esc(asesorName)}</b></div>
        </div>

        <table class="pdf-table">
          <thead>
            <tr>
              <th style="width:36%;text-align:left">PACIENTE</th>
              <th style="width:14%;text-align:center">FECHA</th>
              <th style="width:20%;text-align:center">SUCURSAL</th>
              <th style="width:16%;text-align:center">DOCTOR</th>
              <th style="width:14%;text-align:right">ORIGEN</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>

        <div class="pdf-footer-total">
          TOTAL DE PACIENTES <span class="pdf-total-number">${list.length}</span>
        </div>
      </div>
    `;
    return;
  }

  if(repConfig.type==='citas'){
    list.sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));

    let rowsHtml='';
    if(!list.length){
      rowsHtml=`<tr><td colspan="8" style="text-align:center;padding:36px;color:#94a3b8;font-style:italic">No hay citas registradas en este período.</td></tr>`;
    } else {
      rowsHtml=list.map(c=>`
        <tr>
          <td class="col-paciente"><b>${esc(c.paciente)}</b></td>
          <td style="text-align:center;white-space:nowrap"><b>${esc(fmtDateYY(c.fecha))}</b> ${esc(c.hora)}</td>
          <td style="text-align:center;white-space:nowrap;font-size:11px;color:#64748b">${esc(fmtDateYY((c.creadoEl||'').slice(0,10)))}</td>
          <td style="text-align:center">${esc(c.sucursal)}</td>
          <td style="text-align:center">${esc(c.tratamiento)}</td>
          <td class="col-origen" style="text-align:center">${esc(fmtOrigenShort(c.origen))}</td>
          <td style="text-align:center">${esc(nameOf(c.asesorId))}</td>
          <td style="text-align:center">
            <span class="pill ${pillCls(c.estatus)}" style="font-size:11px;padding:3px 8px">${esc(c.estatus)}</span>
          </td>
        </tr>
      `).join('');
    }

    box.innerHTML=`
      <div class="dmf-pdf-document">
        <div class="pdf-header">
          ${logoSrc?`<img src="${logoSrc}" class="pdf-logo" alt="Dental Fácil">`:''}
          <div class="pdf-title">REPORTE DE CONTROL DE CITAS</div>
          <div class="pdf-divider"></div>
          <div class="pdf-meta-date">${esc(startDate===endDate?fmtDateLongEs(startDate):`Del ${fmtDateLongEs(startDate)} al ${fmtDateLongEs(endDate)}`)}</div>
          <div class="pdf-meta-sub">${esc(periodSub)} · ${basisLabel} · Asesor: <b>${esc(asesorName)}</b></div>
        </div>

        <table class="pdf-table">
          <thead>
            <tr>
              <th style="width:23%;text-align:left">PACIENTE</th>
              <th style="width:14%;text-align:center">FECHA CITA</th>
              <th style="width:13%;text-align:center">REGISTRADA</th>
              <th style="width:13%;text-align:center">SUCURSAL</th>
              <th style="width:14%;text-align:center">TRATAMIENTO</th>
              <th style="width:9%;text-align:center">ORIGEN</th>
              <th style="width:8%;text-align:center">ASESOR</th>
              <th style="width:6%;text-align:center">ESTATUS</th>

          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>

        <div class="pdf-footer-total">
          TOTAL DE CITAS <span class="pdf-total-number">${list.length}</span>
        </div>
      </div>
    `;
    return;
  }

  // Reporte Ejecutivo de Citas y Asistencia
  list.sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  const tot=list.length;
  const asis=list.filter(c=>c.estatus==='Asistió').length;
  const no=list.filter(c=>c.estatus==='No asistió').length;
  const pend=list.filter(c=>c.estatus==='Pendiente'||c.estatus==='Confirmada'||c.estatus==='Confirmó'||c.estatus==='Confirma').length;
  const otr=list.filter(c=>c.estatus==='Reagendó'||c.estatus==='Canceló').length;
  const concl=asis+no;
  const tasa=concl>0?Math.round((asis/concl)*100)+'%':(tot>0?'0%':'—');

  const allKnownUsers = [...USUARIOS];
  const knownNames = new Set(allKnownUsers.map(u => u.nombre.toLowerCase()));
  citas.forEach(c => {
    const aName = nameOf(c.asesorId);
    if(aName && aName !== '—' && !knownNames.has(aName.toLowerCase())){
      knownNames.add(aName.toLowerCase());
      allKnownUsers.push({ id: aName, nombre: aName, rol: 'asesor' });

  });

  const adList = (repConfig.asesor === 'todos')
    ? allKnownUsers
    : allKnownUsers.filter(u => u.id === repConfig.asesor || u.nombre.toLowerCase() === String(repConfig.asesor).toLowerCase());

  let sumT=0,sumA=0,sumN=0,sumP=0,sumO=0;
  const adRows=adList.map(u=>{
    const uCitas=citas.filter(c=>{
      const dVal=basisIsReg?(c.creadoEl||'').slice(0,10):c.fecha;
      return dVal>=startDate && dVal<=endDate && citaMatchesAsesor(c, u.id);
    });
    const uT=uCitas.length;
    const uA=uCitas.filter(c=>c.estatus==='Asistió').length;
    const uN=uCitas.filter(c=>c.estatus==='No asistió').length;
    const uP=uCitas.filter(c=>c.estatus==='Pendiente'||c.estatus==='Confirmada'||c.estatus==='Confirmó'||c.estatus==='Confirma').length;
    const uO=uCitas.filter(c=>c.estatus==='Reagendó'||c.estatus==='Canceló').length;
    sumT+=uT;sumA+=uA;sumN+=uN;sumP+=uP;sumO+=uO;
    const uC=uA+uN;
    const uPct=uC>0?Math.round((uA/uC)*100)+'%':'—';
    return `
      <tr>
        <td style="text-align:left;font-weight:600">${esc(u.nombre)}</td>

        <td style="text-align:center;font-weight:600;color:#0097A7">${uA}</td>
        <td style="text-align:center;color:#E11D48">${uN}</td>
        <td style="text-align:center;color:#D97706">${uP}</td>
        <td style="text-align:center">${uO}</td>
        <td style="text-align:center;font-weight:700;color:#0097A7">${uPct}</td>
      </tr>
    `;
  }).join('');

  const detailRows=list.length?list.map(c=>`
    <tr>
      <td class="col-paciente"><b>${esc(c.paciente)}</b></td>
      <td style="text-align:center;white-space:nowrap"><b>${esc(fmtDateYY(c.fecha))}</b> ${esc(c.hora)}</td>
      <td style="text-align:center;white-space:nowrap;font-size:11px;color:#64748b">${esc(fmtDateYY((c.creadoEl||'').slice(0,10)))}</td>
      <td style="text-align:center">${esc(c.sucursal)}</td>
      <td style="text-align:center">${esc(c.tratamiento)}</td>
      <td class="col-origen" style="text-align:center">${esc(fmtOrigenShort(c.origen))}</td>
      <td style="text-align:center">${esc(nameOf(c.asesorId))}</td>
      <td style="text-align:center">
        <span class="pill ${pillCls(c.estatus)}" style="font-size:11px;padding:3px 8px">${esc(c.estatus)}</span>
      </td>
    </tr>
  `).join(''):`<tr><td colspan="8" style="text-align:center;padding:28px;color:#94a3b8;font-style:italic">No hay citas en este período.</td></tr>`;

  box.innerHTML=`
    <div class="dmf-pdf-document">
      <div class="pdf-header">
        ${logoSrc?`<img src="${logoSrc}" class="pdf-logo" alt="Dental Fácil">`:''}
        <div class="pdf-title">REPORTE EJECUTIVO DE CITAS Y ASISTENCIA</div>
        <div class="pdf-divider"></div>
        <div class="pdf-meta-date">${esc(periodTitle)}</div>
        <div class="pdf-meta-sub">${esc(periodSub)} · ${basisLabel} · Asesor: <b>${esc(asesorName)}</b> · Generado el ${esc(generatedStr)}</div>
      </div>

      <div class="pdf-kpi-grid">
        <div class="pdf-kpi"><div class="pdf-kpi-label">Citas Agendadas</div><div class="pdf-kpi-val">${tot}</div></div>
        <div class="pdf-kpi"><div class="pdf-kpi-label">Pacientes Atendidos</div><div class="pdf-kpi-val text-ok">${asis}</div></div>
        <div class="pdf-kpi"><div class="pdf-kpi-label">No Asistieron</div><div class="pdf-kpi-val text-bad">${no}</div></div>
        <div class="pdf-kpi"><div class="pdf-kpi-label">Citas Pendientes</div><div class="pdf-kpi-val text-pend">${pend}</div></div>
        <div class="pdf-kpi"><div class="pdf-kpi-label">% Asistencia</div><div class="pdf-kpi-val text-ok">${tasa}</div></div>
      </div>

      <div class="pdf-section-title">Resumen de Rendimiento por Asesor</div>
      <table class="pdf-table">
        <thead>
          <tr>

function downloadReportPDF(){
  const element=document.getElementById('pdf-printable-area');
  if(!element)return;
  const fname=getReportFilename();

  if(typeof html2pdf!=='undefined'){
    const btn=document.getElementById('b-pdf-download');
    const origText=btn?btn.innerHTML:'';
    if(btn){
      btn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Generando PDF...';
      btn.disabled=true;
    }
    const opt={
      margin:[10,8,12,8],
      filename:fname,
      image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2,useCORS:true,logging:false},
      jsPDF:{unit:'mm',format:'letter',orientation:'portrait'}
    };
    html2pdf().set(opt).from(element).save().then(()=>{
      if(btn){
        btn.innerHTML=origText;
        btn.disabled=false;
      }
    }).catch(err=>{
      console.error('Error generando PDF con html2pdf:',err);
      if(btn){
        btn.innerHTML=origText;
        btn.disabled=false;
      }
      printReport();
    });
  } else {
    printReport();
  }
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-view]');
  if(e.target.id==='modal')return closeModal();
  if(!t)return;
  if(t.dataset.view){
    view=t.dataset.view;
    if(view==='semana') selectedWeekRef=iso(new Date());
    if(view==='mes') selectedMonthRef=iso(new Date());
    return render();
  }
  const id=t.dataset.id;
  switch(t.dataset.act){
    case'new':citaForm();break;
    case'edit':citaForm(id);break;
    case'status':statusForm(id);break;
    case'save':saveCita(id);break;
    case'savest':saveStatus(id);break;
    case'budget':openBudgetModal(id, t.dataset.key);break;
    case'savebudget':saveBudget(id, t.dataset.cid);break;
    case'delbudget':deleteBudget(id);break;
    case'addabono':openAddAbonoModal(t.dataset.key);break;
    case'saveabono':saveAbono(t.dataset.key);break;
    case'filter-presupuesto':budgetFilter=t.dataset.filter||'todos';renderPresupuestosView();break;
    case'waseguimiento':{
      const b=presupuestos[t.dataset.key];
      if(b) sendBudgetWhatsApp(b.id, b.telefono, b.folio, b.paciente, b.asesorId);
      break;
    }
    case'delete':
      if(confirm('¿Deseas eliminar esta cita permanentemente del sistema?')){
        const cDel = citas.find(c => c.id === id);
        if(cDel && (cDel.estatus === 'Asistió' || cDel.sheetsId || cDel.sheetsAsistenciaEnviada)){
          const sheetsId = cDel.sheetsId || ('dmf_' + cDel.id);
          enviarAsistenciaASheets({ accion: 'eliminar', id: sheetsId });
        }
        DB.delete(id);
        closeModal();
      }
      break;
    case'close':closeModal();break;
    case'csv':exportCSV();break;
    case'pdf-modal':openReportModal();break;
    case'pick':stSel=t.dataset.e;document.querySelectorAll('#st-opts .opt').forEach(b=>b.classList.toggle('on',b.dataset.e===stSel));
      extra(citas.find(c=>c.id===document.querySelector('[data-act=savest]').dataset.id));break;
  }
});

function checkFiltersActive(){
  const q=$('#f-q')?.value.trim()||'';
  const d=$('#f-date')?.value||'';
  const dType=$('#f-date-type')?.value||'cita';
  const st=$('#f-st')?.value||'';
  const su=$('#f-suc')?.value||'';
  const tip=$('#f-tip')?.value||'';
  const ori=$('#f-ori')?.value||'';
  const as=$('#f-as')?.value||'';
  const sort=$('#f-sort')?.value||'cita_asc';

  let activeCount = 0;
  if(q) activeCount++;
  if(d) activeCount++;
  if(st) activeCount++;
  if(su) activeCount++;
  if(tip) activeCount++;
  if(ori) activeCount++;
  if(as) activeCount++;
  if(sort !== 'cita_asc') activeCount++;
  if(d && dType !== 'cita') activeCount++;

  const isActive = activeCount > 0;
  $('#b-reset-filters')?.classList.toggle('hidden', !isActive);
  $('#b-clear-q')?.classList.toggle('hidden', !q);

  $('#f-q')?.classList.toggle('has-val', !!q);
  $('#f-date')?.classList.toggle('has-val', !!d);
  $('#f-st')?.classList.toggle('has-val', !!st);
  $('#f-suc')?.classList.toggle('has-val', !!su);
  $('#f-tip')?.classList.toggle('has-val', !!tip);
  $('#f-ori')?.classList.toggle('has-val', !!ori);
  $('#f-as')?.classList.toggle('has-val', !!as);
  syncAllCustomSelects();
  syncAllCustomPickers();

  const countBadge = $('#b-filter-count');
  const toggleBtn = $('#b-toggle-filters');
  if(countBadge && toggleBtn){
    countBadge.textContent = activeCount;
    countBadge.classList.toggle('hidden', activeCount === 0);
    toggleBtn.classList.toggle('has-filters', activeCount > 0);
  }
}

function resetFilters(){
  if($('#f-q')) $('#f-q').value='';
  if($('#f-date')) $('#f-date').value='';
  if($('#f-date-type')) $('#f-date-type').value='cita';
  if($('#f-st')) $('#f-st').value='';
  if($('#f-suc')) $('#f-suc').value='';
  if($('#f-tip')) $('#f-tip').value='';
  if($('#f-ori')) $('#f-ori').value='';
  if($('#f-as')) $('#f-as').value='';
  if($('#f-sort')) $('#f-sort').value='cita_asc';
  syncAllCustomSelects();
  syncAllCustomPickers();
  checkFiltersActive();
  render();
}

function toggleFilters(force){
  filtersOpen = (typeof force === 'boolean') ? force : !filtersOpen;
  $('#filters')?.classList.toggle('hidden', !filtersOpen);
  $('#b-toggle-filters')?.classList.toggle('active', filtersOpen);
  if(filtersOpen){
    $('#f-q')?.focus();
    enhanceAllSelects($('#filters'));
    enhanceAllDatePickers($('#filters'));
  }
}

$('#b-toggle-filters')?.addEventListener('click', () => toggleFilters());
$('#b-close-filters')?.addEventListener('click', () => toggleFilters(false));
$('#b-reset-filters')?.addEventListener('click', resetFilters);
$('#b-clear-q')?.addEventListener('click', ()=>{
  if($('#f-q')) {
    $('#f-q').value='';
    $('#f-q').focus();
  }
  checkFiltersActive();
  render();
});

['f-q','f-date','f-date-type','f-st','f-suc','f-as','f-sort','f-tip','f-ori'].forEach(i=>{
  const el=$('#'+i);
  if(el){
    el.addEventListener('input', ()=>{
      checkFiltersActive();
      render();
    });
    el.addEventListener('change', ()=>{
      checkFiltersActive();
      render();
    });
  }
});
if($('#f-date')){
  $('#f-date').addEventListener('change', e=>{
    if(view==='semana' && e.target.value){
      selectedWeekRef=e.target.value;
      render();
    } else if(view==='mes' && e.target.value){
      selectedMonthRef=e.target.value;
      render();
    }
  });
}

// Menú de configuración y perfil
const bSettings=$('#b-settings'), settingsMenu=$('#settings-menu');
if(bSettings&&settingsMenu){
  bSettings.addEventListener('click',e=>{
    e.stopPropagation();
    const isClosed=settingsMenu.classList.contains('hidden');
    settingsMenu.classList.toggle('hidden',!isClosed);
    bSettings.setAttribute('aria-expanded',String(isClosed));
  });
  settingsMenu.addEventListener('click',e=>{
    const btn=e.target.closest('button');
    if(btn){
      settingsMenu.classList.add('hidden');
      bSettings.setAttribute('aria-expanded','false');
    }
  });
}
document.addEventListener('click',e=>{
  if(settingsMenu&&!settingsMenu.classList.contains('hidden')){
    if(!settingsMenu.contains(e.target)&&e.target!==bSettings&&!bSettings.contains(e.target)){
      settingsMenu.classList.add('hidden');
      if(bSettings) bSettings.setAttribute('aria-expanded','false');
    }
  }
});

/* ============ INIT ============ */
(async function(){
  try{
    let th=null;try{th=localStorage.getItem('dmf_theme')}catch(e){}
    document.documentElement.dataset.theme=th||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    
    // Carga inmediata de respaldo local para inicio instantáneo
    try{ citas=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ citas=[]; }

    const tick=()=>{$('#clock').textContent=new Date().toLocaleString('es-MX',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
    tick();setInterval(tick,30000);
    const su=sessionStorage.getItem('dmf_user');user=USUARIOS.find(u=>u.id===su)||null;
    if(user){
      try{ startApp(); }catch(e){ console.error('Error starting app:', e); showLogin(); }
    }else{
      showLogin();
    }

    // Sincronización en vivo con la base de datos Supabase
    try{
      citas = await DB.loadAll();
      if(user) render();
      initRealtime();
    }catch(err){
      console.warn('Error syncing cloud db:', err);
    }
  }catch(fatal){
    console.error('Fatal initialization error:', fatal);
    showLogin();
  }
})();
</script>
