<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Inicio · Dental MÁS FÁCIL</title>
  <link rel="icon" type="image/png" href="logo-dental-facil.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:#F0F2F8;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    .card{
      background:#FFFFFF;
      border-radius:28px;
      box-shadow:0 8px 48px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.04);
      padding:52px 48px;
      width:100%;
      max-width:560px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:40px;
    }
    .logo-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .logo-wrap img{
      height:52px;
      width:auto;
      display:block;
    }
    .btn-group{
      display:flex;
      flex-direction:column;
      gap:16px;
      width:100%;
    }
    .btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      width:100%;
      padding:16px 20px;
      background:#F0FAFA;
      color:#0F172A;
      border:1.5px solid #0097a7;
      border-radius:14px;
      font-family:inherit;
      font-size:16px;
      font-weight:500;
      text-align:left;
      text-decoration:none;
      cursor:pointer;
      transition:background .15s ease, border-color .15s ease;
    }
    .btn:hover{
      background:#E0F5F7;
      border-color:#007a8a;
    }
    .btn:active{
      opacity:0.9;
    }
    .btn-arrow{
      color:#0097a7;
      font-size:18px;
      flex-shrink:0;
    }
    @media (max-width:480px){
      .card{padding:36px 20px; border-radius:20px; max-width:100%;}
      .logo-wrap img{height:42px;}
      .btn{font-size:15px; padding:14px 16px;}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="logo-dental-facil.png" alt="Dental MÁS FÁCIL">
    </div>
    <div class="btn-group">
      <a class="btn" href="recepcion.html">
        <span>Recepción</span>
        <span class="btn-arrow">›</span>
      </a>
      <a class="btn" href="citas.html">
        <span>Citas</span>
        <span class="btn-arrow">›</span>
      </a>
    </div>
  </div>
</body>
</html>
