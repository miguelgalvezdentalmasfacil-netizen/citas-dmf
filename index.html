<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Inicio · Dental MÁS FÁCIL</title>
  <link rel="icon" type="image/png" href="logo-dental-facil.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:#F0F2F8;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    .card{
      background:#FFFFFF;
      border-radius:28px;
      box-shadow:0 8px 48px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.04);
      padding:48px 48px 44px;
      width:100%;
      max-width:420px;
      display:flex;
      flex-direction:column;
      gap:28px;
    }

    /* ---- Header: Logo | Recepción  Citas ---- */
    .card-header{
      display:flex;
      align-items:center;
      gap:0;
    }
    .logo-wrap img{
      height:44px;
      width:auto;
      display:block;
    }
    .divider{
      width:1px;
      height:36px;
      background:#CBD5E1;
      margin:0 18px;
      flex-shrink:0;
    }
    .header-labels{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .label-tag{
      font-size:14px;
      font-weight:600;
      color:#0097a7;
      letter-spacing:0.01em;
    }
    .label-sep{
      font-size:13px;
      color:#CBD5E1;
      font-weight:400;
    }

    /* ---- Title block ---- */
    .card-title-block{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .card-title{
      font-size:26px;
      font-weight:700;
      color:#0F172A;
      letter-spacing:-0.3px;
      line-height:1.2;
    }
    .card-subtitle{
      font-size:14px;
      font-weight:400;
      color:#64748B;
      line-height:1.5;
    }

    /* ---- Buttons ---- */
    .btn-group{
      display:flex;
      flex-direction:column;
      gap:14px;
      width:100%;
    }
    .btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      width:100%;
      padding:16px 20px;
      background:#F0FAFA;
      color:#0F172A;
      border:1.5px solid #0097a7;
      border-radius:14px;
      font-family:inherit;
      font-size:16px;
      font-weight:500;
      text-align:left;
      text-decoration:none;
      cursor:pointer;
      transition:background .15s ease, border-color .15s ease;
    }
    .btn:hover{
      background:#E0F5F7;
      border-color:#007a8a;
    }
    .btn:active{ opacity:0.9; }
    .btn-arrow{
      color:#0097a7;
      font-size:20px;
      flex-shrink:0;
      line-height:1;
    }

    @media (max-width:520px){
      .card{ padding:36px 20px 32px; border-radius:20px; }
      .logo-wrap img{ height:36px; }
      .card-title{ font-size:22px; }
      .btn{ font-size:15px; padding:14px 16px; }
      .divider{ margin:0 12px; }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <div class="logo-wrap">
        <img src="logo-dental-facil.png" alt="Dental MÁS FÁCIL">
      </div>
      <div class="divider"></div>
      <div class="header-labels">
        <span class="label-tag">Recepción</span>
        <span class="label-sep">·</span>
        <span class="label-tag">Citas</span>
      </div>
    </div>

    <!-- Title -->
    <div class="card-title-block">
      <h1 class="card-title">Bienvenido al sistema</h1>
      <p class="card-subtitle">Esta es la app de recepción y citas de Dental MÁS FÁCIL.<br>Elige el módulo al que quieres acceder.</p>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
      <a class="btn" href="recepcion.html">
        <span>Recepción</span>
        <span class="btn-arrow">›</span>
      </a>
      <a class="btn" href="citas.html">
        <span>Citas</span>
        <span class="btn-arrow">›</span>
      </a>
    </div>

  </div>
</body>
</html>
